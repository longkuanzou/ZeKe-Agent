# 苏泊尔电饭煲保修政策
# 来源：F50X96 系列通用本「售后服务」页（说明书2 p5-p6）
# 这是本库目前**唯一**一份写明包修年限与认定规则的小家电品牌资料，比空调两家更完整。
policy_id: brand.supor.warranty
brand: supor
brand_cn: 苏泊尔
applies_to: {appliance: [rice_cooker]}
effective_from: 2024-01-01
source: "02_ingest/rice_cooker/supor/F50X96/ocr.md（说明书2 p5-6 售后服务）"
verified: true
source_note: OCR 原文，关键数字（一年 / 6 个月 / 顺延两天）均已人工复核
updated: 2026-10-23

summary: 整机包修 1 年；商业用途包修 6 个月

terms:
  duration: {家庭使用: "1 年", 商业用途: "6 个月"}
  start_from: 消费者收到产品之日
  start_evidence: 网购凭证 / 有效电子保修卡 / 有效购买发票
  start_fallback: 发票日期与实际收到日期不一致时以实际收到日为准；无法提供收货时间凭证的，按订单支付时间顺延 2 天计算
  require_documents: [网购凭证, 有效电子保修卡, 有效购买发票]
  service_mode: 带包修证明把故障产品送到苏泊尔特约售后服务商处免费维修

not_free_service:      # 说明书原文列出 9 条
  - 消费者因使用、运输、维护、保管不当等原因造成损坏
  - 非苏泊尔特约服务商维修造成损坏
  - 消费者自行拆卸造成损坏
  - 自行购买、更换非原装零配件造成损坏
  - 无有效包修证明且无法证明在包修期内
  - 三包凭证与维修产品型号不符或有涂改
  - 地震、火灾、水灾等不可抗力造成损坏
  - 超出包修期
  - text: 使用环境（电压、湿度、温度、海拔、虫害等）明显超出说明书要求
    note: 这条与 SF50FC733 说明书里「正常工作海拔 0-2000 米」直接对应，高原用户报煮不熟先问海拔

answer_rules:
  - 起算点是"收到产品之日"，不是下单日，也不是出厂日；无凭证按订单支付时间顺延 2 天
  - 商业用途只保 6 个月，用户说"店里用的/食堂用的"要主动确认
  - 送修而非上门：电饭煲这类小家电通常要求自送特约服务商，不要说"师傅马上上门"
  - 「人为损坏」不下结论，列条款后转人工
  - 与美的空调的「6 年」「出厂+180 天」完全不同，禁止混用

escalate_hotline: "400-8899-717"

