# 海尔空调保修政策（来源：说明书 p33「海尔家用空调保修证使用说明」）
policy_id: brand.haier.warranty
brand: haier
applies_to: {appliance: [air_conditioner]}
effective_from: 2026-02-01        # 对应说明书 2026 年第 2 版
source: "海尔 KFR-35GW/E1-1 使用安装说明书 p33"
verified: true
updated: 2026-10-21

summary: 整机免费包修 6 年

terms:
  duration: {整机: "6 年", source: p33}
  start_from: 安装完成之日
  start_fallback: 无法确认安装时间时，以购机发票为准；或按机器生产时间延后 3 个月
  deduction: 扣除因修理占用和无零部件待修的时间
  legal_basis: 《中华人民共和国消费者权益保护法》《部分商品修理更换退货责任规定》
  return_policy: 参照国家《部分商品修理更换退货责任规定》执行

not_free_service:      # 说明书列明"不属于免费服务范围，但可实行收费修复"
  - 不能出示保修说明及发票或有效购机凭证
  - 有效购机凭证、包修凭证不符或涂改
  - 因不可抗拒因素或使用、维护、保管不当造成损坏
  - 未经许可自行修理造成的损坏
  - 超过三包有效期，经修复仍可继续使用
  - 因使用环境恶劣造成的蒸发器、冷凝器脏堵或腐蚀

out_of_warranty:
  type: 有偿服务（超包收费）
  items: [修理人工费, 零部件费, 超距离交通费]
  invoice: 服务人员须出示统一收费标准并开具发票，否则用户可拒绝交费
  source: p33

user_notes:
  - 机器条形码请用户保存，维修人员每次上门会扫描条形码建立维修档案
  - 「性能故障」定义：不符合安全卫生要求、存在危及人身财产安全的不合理危险，或不具备应当具备的使用性能，或不符合明示质量状况

answer_rules:
  - 保修期起点是"安装完成日"，不是下单日/签收日 —— 回答必须说清
  - 无发票时按生产时间延后 3 个月推算，不要直接说"没发票就不保修"
  - 用户问"人为损坏能不能保"→ 不给结论，按 not_free_service 条目说明后转人工
