# ══════════════════════════════════════════════════════════════
# 业务方速查表交叉核对（2026-10-23 新增）
#
# 业务方给了《常见错误代码及含义速查表》，E 段与本文件**大面积不一致**：
#   本文件（haier.com 英文站 + 海外服务手册）：E1 室内环温传感器 / E2 室内盘管传感器 / E4 室内主板 EEPROM / E7 室内外机通信
#   业务方速查表                              ：E0/E1 内外机通讯 / E2/E3 系统内部故障·低压保护(缺氟) / E4/E6 压缩机排气保护·电压过低保护
#
# 两边都不是本批 5 份说明书的原文（说明书全篇无代码释义），谁也不能压倒谁。
# 但有一条重要区别：**本文件的来源是海外站点与海外手册，业务方表多半是国内售后速查**，
# 而海尔国内外机型的代码命名本来就不完全一致 → 国内场景下业务方表可能更贴近实际。
# 反向风险也存在（速查表常把不同系列混在一起），所以不裁定，两套并存。
biz_crosscheck:
  source_kind: biz_provided
  source: "业务方提供的常见错误代码速查表（2026-10-23）"
  verdict: library_prevails          # wide_conflict_on_e_codes（原描述，见下方 ruling）
  ruling_policy: >
    2026-10-23 业务方裁定：**凡与现有条目冲突的，一律以现有表为准**（速查表对应条目不采纳）。
    理由：速查表未标机型平台，现有表至少能追到说明书或可对照的官方代码族。
    本条裁定不改变 usable_scope——"采用哪一套"和"这套本身是否经售后核实"是两件事。
  ruling_date: 2026-10-23
  ruling_by: 业务方

  conflict:
    - code: E1
      ours: 室内环境温度传感器故障（sensor, attention）
      biz: 内 / 外机通讯故障
      severity_agree: partial        # 传感器类多可观察，通讯类多为停机
      reply: 断电 10 分钟重上电；仍显示则建单，只说"传感器或通讯这类问题"，不报部件
    - code: E2
      ours: 室内盘管（蒸发器）温度传感器故障（sensor, attention）
      biz: 系统内部故障 / 系统低压保护（缺氟）
      severity_agree: partial
      reply: 同上；若同时"制冷效果变差"，可提示"可能涉及冷媒"，但要说明需上门检测确认
    - code: E4
      ours: 室内主板存储（EEPROM）参数异常（module, stop_and_call）
      biz: 压缩机排气保护
      severity_agree: stop_and_call
      reply: 停机报修，不报部件

  biz_only:                          # 本文件未收录，仅业务方表有
    - {code: E0, cn: 内 / 外机通讯故障, severity: stop_and_call, status: 未核实}
    - {code: E3, cn: 系统低压保护（缺氟）, severity: attention, status: 未核实}
    - {code: E6, cn: 电压过低保护, severity: attention, status: 未核实}
  biz_only_note: >
      E6（电压过低保护）先让用户确认家里电压/是否多台大功率同时运行，
      电压恢复后通常会自行复位——这条即使代码表有偏差，处置也不会错。

  ours_only:                         # 本文件有、速查表没有的，继续按本文件做内部分诊
    - {codes: [E5, E7, E9, E14], note: 防冻结 / 室内外机通信 / 室内过载 / 室内风机}
    - {codes: F1..F43 共 23 条, note: F 段业务方表完全未覆盖，本文件继续作为唯一来源}

  note: >
    冲突集中在 E 段 7 条里的 3 条（E1/E2/E4），比例过高，说明两份表大概率来自不同系列或不同代机型。
    在拿到海尔国内售后书面代码表之前，E 段一律按 triage_only 使用，对外只给"类别 + 处置"。

  # ── 裁定结果（2026-10-23）──────────────────────────────
  adopt:
    - {code: "F1..F43（23 条）", note: 速查表未覆盖，继续作为唯一来源}
    - {code: E5, note: 速查表未覆盖}
    - {code: E7, note: 速查表未覆盖}
    - {code: E9, note: 速查表未覆盖}
    - {code: E14, note: 速查表未覆盖}
  not_adopt:
    - {code: E1, ours: 室内环境温度传感器故障, biz: 内/外机通讯故障, action: 按现有表分诊}
    - {code: E2, ours: 室内盘管温度传感器故障, biz: 系统内部故障/低压保护, action: 按现有表分诊}
    - {code: E4, ours: 室内主板 EEPROM 参数异常, biz: 压缩机排气保护, action: 按现有表分诊}
    - {code: E0, ours: 未收录, biz: 内/外机通讯故障, action: 按"代码未收录"处理：建单 + 记录代码原文}
    - {code: E3, ours: 未收录, biz: 系统低压保护（缺氟）, action: 按"代码未收录"处理}
    - {code: E6, ours: 未收录, biz: 电压过低保护, action: 按"代码未收录"处理；可先让用户确认家里电压}
  note: >
    速查表 E 段 7 条里 3 条冲突、3 条未收录，只有 F 段之外的边角码对得上——
    这份表基本不能用于海尔空调。现有表继续按 triage_only 用。
