# 海尔空调备件/耗材目录
# 报修建单时需要"带什么件"，售前/使用需要"耗材型号"
policy_id: brand.haier.parts_catalog
brand: haier
applies_to: {appliance: [air_conditioner]}
verified: false
source: null
updated: 2026-10-21

# 说明书可确认的随机附件（安装相关，不是备件收费项）
included_accessories:
  source: p15-16 附件清单
  items:
    - 排水管 1 根
    - 排水弯头 1 个
    - 遥控器 1 个
    - 说明书/保修证

consumables:            # 耗材（用户可自购/需更换）
  - key: filter_mesh
    cn: 过滤网/滤尘网
    part_no: null
    price: null
    verified: false
  - key: remote_battery
    cn: 遥控器电池
    spec: null
    note: 常见为 7 号电池，需按遥控器确认

replaceable_parts:      # 可更换部件（建单时按此选件，避免师傅跑两趟）
  - key: remote
    cn: 遥控器
  - key: drain_hose
    cn: 排水管
  - key: bracket
    cn: 安装支架
  - key: pcb_indoor
    cn: 室内机主板
  - key: fan_motor
    cn: 风机电机
  - key: compressor
    cn: 压缩机
  - key: four_way_valve
    cn: 四通阀

todo:
  - 补零件号（part_no）与参考价，才能支撑"换件多少钱"类问题
  - 备件库存需接工单/库存系统，知识库只保留"部件是否存在"

# ══════════════════════════════════════════════════════════════
# 备件参考价（2026-10-23 业务方提供《家电备件价格参考表》）
#
# 性质：市场参考价（含配件费），不含上门费/人工费/高空作业费；零件号为参考编号，
#      实际报修以官方售后系统查到的零件号为准。官方原厂件通常是兼容件的 2~3 倍。
# 所以 price_verified 保持 false —— 能答「换个排水泵大概多少钱」，
# 不能答「这是我们的标准价」，也不能把配件价当成「修好一共多少钱」。
price_verified: false
price_basis: >
  业务方提供的备件价格参考表（2024~2026 年公开数据整理），
  区间为市场价含配件费、不含人工与上门费；实际以当地售后网点报价为准。
price_source: 家电备件价格参考表.xlsx（业务方 2026-10-23 提供）
parts_price_list:
  source_sheet: 海尔空调备件
  items:
    - key: remote
      cn: 遥控器
      part_no: "HA-AC-RC-001"
      price_min: 35
      price_max: 65
      price_unit: 元
      note: "通用款/变频款不同，以机身铭牌为准"
    - key: filter_mesh
      cn: 过滤网/滤尘网
      part_no: "HA-AC-FM-001"
      price_min: 8
      price_max: 25
      price_unit: 元
      note: "耗材，建议每季度清洗/半年更换"
    - key: drain_hose
      cn: 排水管
      part_no: "HA-AC-DH-001"
      price_min: 3
      price_max: 15
      price_unit: 元/米
      note: "官方售后3元/米，市场款20~50元/米"
    - key: bracket
      cn: 安装支架
      part_no: "HA-AC-BR-001"
      price_min: 40
      price_max: 150
      price_unit: 元
      note: "普通款40~80元/副，高端不锈钢款80~150元/副"
    - key: pcb_indoor
      cn: 室内机主板
      part_no: "HA-AC-PCB-I-001"
      price_min: 200
      price_max: 800
      price_unit: 元
      note: "定频款偏低，变频款/柜机偏高"
    - key: fan_motor
      cn: 风机电机
      part_no: "HA-AC-FM-002"
      price_min: 150
      price_max: 450
      price_unit: 元
      note: "内机电机50~120元，外机电机90~160元(配件价)"
    - key: compressor
      cn: 压缩机
      part_no: "HA-AC-CMP-001"
      price_min: 800
      price_max: 2000
      price_unit: 元
      note: "1.5~3匹普通机型500~2000元，外资品牌可达3500~5500元"
    - key: four_way_valve
      cn: 四通阀
      part_no: "HA-AC-FWV-001"
      price_min: 150
      price_max: 500
      price_unit: 元
      note: "含人工总费用约200~500元"
