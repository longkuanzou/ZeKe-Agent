# ══════════════════════════════════════════════════════════════
# 保外维修分级人工费（2026-10-23 新增）
#
# 与上面的 items 是两套口径，别混：
#   items            = 安装/移机/清洗这类"按项目"的辅加收费
#   repair_grade_labor = 保外**修**的分级人工费（上门检测 / 简修 / 小修 / 中修大修）
# 金额来自业务方提供的参考表，价格性质仍是"参考"：不含配件、不含远程费，以当地网点报价为准。
repair_grade_labor:
  source_kind: biz_reference
  source: "业务方提供的空调/洗衣机保外维修收费标准参考（2026-10-23）"
  price_verified: false
  scope_note: 基础人工费，不含配件费与远程费；具体以当地官方售后网点实际报价为准
  grades:
    - appliance: 挂机空调
      trip_inspection: {price_min: 50, price_max: 50}
      minor_adjust: {price_min: 90, price_max: 90}
      small_repair: {price_min: 150, price_max: 150}
      medium_major: {price_min: 240, price_max: 240, core_part_extra: 300}
      core_part_note: 中修/大修涉及核心部件时按 300 元档计
    - appliance: 柜机空调
      trip_inspection: {price_min: 50, price_max: 50}
      minor_adjust: {price_min: 90, price_max: 90}
      small_repair: {price_min: 200, price_max: 200}
      medium_major: {price_min: 350, price_max: 350, core_part_extra: 480}
      core_part_note: 中修/大修涉及核心部件时按 480 元档计
  note: >
    挂机与柜机的人工费差在小修之后（150 vs 200、240 vs 350），简修与上门检测同价。
    这符合柜机拆装工作量更大的常识，内部一致性没问题。

repair_grade_answer_rules:
  - 保外报修先讲"上门检测费 + 可能的人工等级"，不要一上来说"修好大概要几百"
  - 用户问"修一下多少钱" → 答："要看是简修还是小修，简修 90 左右，小修挂机 150、柜机 200；
    具体等级师傅现场判断后报给您，配件另算"
  - 用户问"为什么这么贵" → 拆成"上门检测费 + 人工等级 + 配件"三项说，不合并成一句总价
  - 严禁把中修/大修的 240/350 说成"封顶价"——它不含配件和核心件加价
