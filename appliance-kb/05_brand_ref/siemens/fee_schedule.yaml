# ══════════════════════════════════════════════════════════════
# 保外维修分级人工费（2026-10-23 新增）
#
# ⚠ 这一份数据本身可疑，不要直接照念，原因写在 suspect 里：
#   业务方给的序列是 上门检测 50 / 简修(调整) 70 / 小修 45~60 / 中修大修 65~100（核心件 600+）
#   小修(45~60) 竟然低于简修(70)，而且中修上限 100 远低于核心件 600+ —— 这在价格逻辑上说不通。
#   最可能是原表格的列在转录时错位（把配件费/工时数当成了小修价），所以只采纳与其他三家对得上的一项。
repair_grade_labor:
  source_kind: biz_reference
  source: "业务方提供的洗衣机保外维修收费标准参考（2026-10-23）"
  price_verified: false
  scope_note: 基础人工费，不含配件费与远程费；具体以当地官方售后网点实际报价为准
  grades:
    - appliance: 洗衣机
      trip_inspection: {price_min: 50, price_max: 50, usable: true}
      minor_adjust: {price_min: 70, price_max: 70, usable: false}
      small_repair: {price_min: 45, price_max: 60, usable: false}
      medium_major: {price_min: 65, price_max: 100, core_part_extra: 600, usable: false}
  suspect: true
  suspect_reason: >
    小修区间(45~60)低于简修(70)，中修上限(100)远低于核心件(600+)，与同品类其他品牌的数量级也不符
    （小天鹅小修 200~500、中修 500~1000）。判断为原表列错位或把工时/配件费混进了人工档。
  usable_now: 只有"上门检测费 50 元"这一项可以对外说，其余三项一律不报

repair_grade_answer_rules:
  - 保外只能答"上门检测费 50 元"，其余人工等级不报数字
  - 用户问"修一下多少钱" → "要师傅上门检测后按维修等级报价，我这边只能确认上门检测费是 50"
  - 用户报"售后报了 XX 元" → 不评价金额高低，只讲"可以让师傅出示收费标准并开具发票"
  - 严禁把错位可疑的小修 45~60 报给用户——一旦与实际报价差十倍，就是价格投诉
