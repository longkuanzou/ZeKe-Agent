answer_rules:
  - 先讲标准安装免费，再讲可能产生的额外项
  - 保外维修必须说明"人工费 + 原厂配件费"两部分，不能只说人工
  - 洗衣机没有高空作业费
  - 上排水机型不需要地漏
  - 给区间必须带定性："这是行业常见范围，具体以官方报价为准"
  - 用户追问具体金额 → 引导客服热线 400 889 9999 或转人工报价

