# ══════════════════════════════════════════════════════════════
# 业务方速查表交叉核对（2026-10-23 新增）
#
# 业务方给了《常见错误代码及含义速查表》，其中对 E19/E20/E21 的解释与本文件**完全相反**：
#   本文件（西门子家电官方服务号，2025-04）：E19 水温未达标 / E20 加热异常 / E21 转速过低 —— 全是加热与电机
#   业务方速查表                       ：E19 分配器阀门 / E20 排水水位温度传感器 / E21 进排水系统 —— 全是水与投放
#
# 两边都不是本批说明书的原文（说明书不做逐码释义），所以**谁也没有压倒性依据**。
# 处理方式：
#   ① 不覆盖任何一边，两套都留在文件里
#   ② 严重度两边一致（都要停机建单），所以对外话术不受影响：统一说"要停机检查"
#   ③ 只有"要不要报具体部件名"受影响 → 冲突项一律不报部件
biz_crosscheck:
  source_kind: biz_provided
  source: "业务方提供的常见错误代码速查表（2026-10-23）"
  verdict: library_prevails          # conflict_on_core_codes（原描述，见下方 ruling）
  ruling_policy: >
    2026-10-23 业务方裁定：**凡与现有条目冲突的，一律以现有表为准**（速查表对应条目不采纳）。
    理由：速查表未标机型平台，现有表至少能追到说明书或可对照的官方代码族。
    本条裁定不改变 usable_scope——"采用哪一套"和"这套本身是否经售后核实"是两件事。
  ruling_date: 2026-10-23
  ruling_by: 业务方

  matched_with_wording:            # 根因一致、措辞不同，可合并使用
    - code: E17
      ours: 进水水压过低（低于 10 升/分钟）
      biz: 进水超时
      note: 同一件事的两种说法——水压不足的直接表现就是进水超时
    - code: E18
      ours: 排水泵堵塞或排水管弯折
      biz: 排水超时（堵塞）
      note: 一致

  conflict:                        # 禁止覆盖，只做内部对照
    - code: E19
      ours: 水温未达到设定值（分类 heat，严重度 stop_and_call）
      biz: 分配器 / 内部阀门控制错误（限带 i-DOS 智能投放的机型）
      severity_agree: stop_and_call
      applicability: 本库 5 台均未见标明 i-DOS；若确实无此功能，E19 更可能是温度相关
      reply: 停机报修，只说"这个代码要停机，师傅带检测仪上门确认"，不报部件
    - code: E20
      ours: 加热异常（异常升温，分类 heat）
      biz: 排水 / 水位 / 温度传感器异常
      severity_agree: stop_and_call
      reply: 同上，停机报修
    - code: E21
      ours: 转速过低（电机或测速异常，分类 motor）
      biz: 进水 / 排水系统异常
      severity_agree: stop_and_call
      reply: 同上，停机报修

  biz_only:                        # 本文件未收录，仅业务方表有，按"待核"使用
    - {code: E1, cn: 门锁异常, severity: stop_and_call, status: 未核实}
    - {code: E3, cn: 温度传感器异常, severity: stop_and_call, status: 未核实}
  biz_only_note: >
      这两条与本文件的 E16（机门未关好）可能重叠，也可能属于不同平台。
      对外只说到"门或温度检测这类问题，需要师傅确认"，不报部件名。

  note: >
    E19/E20/E21 的裁定直接决定"是加热系统还是进排水系统"的备件方向，
    核错的代价是师傅带错件白跑一趟。必须由博西售后出书面代码表定版，见 todo 与 confirm_queue。

  # ── 裁定结果（2026-10-23）──────────────────────────────
  adopt:
    - {code: E17, cn: 进水水压过低 / 进水超时, note: 两边一致，可合并使用}
    - {code: E18, cn: 排水泵堵塞 / 排水超时, note: 两边一致，可合并使用}
    - {code: "E16 / E23 / E31 / E32 / E33 / CL / End", note: 速查表未覆盖，继续用现有表}
  not_adopt:
    - {code: E19, ours: 水温未达到设定值, biz: 分配器/内部阀门控制错误, action: 按现有表归类为加热类，停机报修}
    - {code: E20, ours: 加热异常（异常升温）, biz: 排水/水位/温度传感器异常, action: 按现有表归类为加热类，停机报修}
    - {code: E21, ours: 转速过低（电机或测速异常）, biz: 进水/排水系统异常, action: 按现有表归类为电机类，停机报修}
    - {code: E1, ours: 未收录, biz: 门锁异常, action: 按"代码未收录"处理：建单 + 记录代码原文}
    - {code: E3, ours: 未收录, biz: 温度传感器异常, action: 按"代码未收录"处理}
  note: >
    这三条是备件方向的分歧（加热/电机 vs 进排水），裁定后按现有表走，
    对外仍然只说"要停机，师傅带检测仪上门"——因为现有表本身也只是官方服务号来源，未经书面确认。
