# 美的空调保修政策（来源：说明书 p36「三包」免费包修政策 / 售后服务）
policy_id: brand.midea.warranty
brand: midea
applies_to: {appliance: [air_conditioner]}
effective_from: 2026-01-01
source: "美的 KFR-35GW/Q2 使用安装说明书 p36"
verified: true
updated: 2026-10-21

summary: 整机包修 6 年（基站空调 3 年）

terms:
  duration: {整机: "6 年", 基站空调: "3 年", source: p36}
  start_from: 安装日期
  start_fallback: 无法出示购机凭证/保修卡/签收凭证时，安装日期按条形码出厂日期往后延 180 天；条形码不存在则不予包修
  require_documents: [《美的空调保修卡》, 有效购机发票或购机证明]
  require_installer: 必须由美的指定服务网点安装、移机、维修

free_conditions:
  - 能提供《保修卡》
  - 能提供有效购机发票或购机证明
  - 由指定服务网点安装/移机/维修
  - 在包修期内（以安装日期起算）
  - 非人为原因、非使用不当/保管不当造成的故障
  - 能出示凭证（否则按出厂日期+180天推算）

not_free_service:      # 说明书列明"不属于三包服务范围（实行收费服务）"
  - 因用户电源不符合国家安全用电标准造成空调损坏
  - 因使用环境恶劣造成蒸发器/冷凝器脏堵或腐蚀
  - 无《保修卡》、签收凭证和有效购机凭证
  - 保修卡上的型号/机身号与维修机型不符
  - 保修卡或发票涂改
  - 降价销售的"等外品/处理品/非卖品"
  - 超过包修期
  - 不可抗拒因素造成损坏

answer_rules:
  - 起点是安装日期；无凭证按出厂日期 +180 天，与海尔的「+3 个月」不同，不可混用
  - 用户无发票时不要直接拒绝，先按 fallback 推算
  - 「人为损坏」不给结论，列条目后转人工
