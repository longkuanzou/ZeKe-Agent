# ══════════════════════════════════════════════════════════════
# 备件参考价（2026-10-23 业务方提供《家电备件价格参考表》）
#
# 性质：市场参考价（含配件费），不含上门费/人工费/高空作业费；零件号为参考编号，
#      实际报修以官方售后系统查到的零件号为准。官方原厂件通常是兼容件的 2~3 倍。
# 所以 price_verified 保持 false —— 能答「换个排水泵大概多少钱」，
# 不能答「这是我们的标准价」，也不能把配件价当成「修好一共多少钱」。
price_verified: false
price_basis: >
  业务方提供的备件价格参考表（2024~2026 年公开数据整理），
  区间为市场价含配件费、不含人工与上门费；实际以当地售后网点报价为准。
price_source: 家电备件价格参考表.xlsx（业务方 2026-10-23 提供）
