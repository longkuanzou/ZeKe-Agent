# ── 电饭煲 ──────────────────────────────────────────────
# 电饭煲的"备件"其实大半是用户能自己装的配件（内胆、密封圈、蒸汽阀），
# 这类问题九成不需要上门：先判断是件坏了还是没装到位，能寄件就寄件。
rice_cooker_consumables:
  - key: inner_pot
    cn: 内锅/内胆
    note: 涂层脱落、变形才换；变形后继续用会导致受热不均、煮不熟
  - key: seal_ring
    cn: 上盖密封圈
    note: 老化漏汽会表现为"饭夹生、蒸汽从边上冒"
  - key: steam_valve
    cn: 蒸汽阀/微压阀组件
    note: 微压机型核心件；装不到位（没听到卡合声）会漏汽
  - key: measuring_cup
    cn: 量杯
  - key: rice_spatula
    cn: 饭勺/汤勺
  - key: steam_rack
    cn: 蒸笼

rice_cooker_replaceable_parts:
  - key: heating_plate
    cn: 电热盘（底盘加热机型）
  - key: ih_coil
    cn: 线圈盘（IH 机型）
  - key: top_sensor
    cn: 上盖温度传感器
  - key: bottom_sensor
    cn: 底部温度传感器
  - key: igbt
    cn: IGBT 功率模块
  - key: pcb
    cn: 主控板
  - key: lid_latch
    cn: 开盖扣/盖锁组件
  - key: far_infrared_tube
    cn: 顶部远红外发热管（苏泊尔微压机型有，美的机型无此件）

