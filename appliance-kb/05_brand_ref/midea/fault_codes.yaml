  - 美的电饭煲逐码表核对本批 3 份图片资料的故障章后，可把 codes_verified 置 true

# ══════════════════════════════════════════════════════════════
# 业务方速查表交叉核对（2026-10-23 新增）
#
# 业务方给了《常见错误代码及含义速查表》，两个品类的比对结果**完全相反**：
#   电饭煲：E1/E2 与本文件一致 → 可以直接用
#   空调  ：E 段几乎全不一致 → 不能覆盖
# 这正好印证文件开头那句"同品牌不同品类，同一个字母都不是同一件事"。
biz_crosscheck:
  source_kind: biz_provided
  source: "业务方提供的常见错误代码速查表（2026-10-23）"
  verdict: library_prevails          # rice_cooker_ok_aircon_conflict（原描述，见下方 ruling）
  ruling_policy: >
    2026-10-23 业务方裁定：**凡与现有条目冲突的，一律以现有表为准**（速查表对应条目不采纳）。
    理由：速查表未标机型平台，现有表至少能追到说明书或可对照的官方代码族。
    本条裁定不改变 usable_scope——"采用哪一套"和"这套本身是否经售后核实"是两件事。
  ruling_date: 2026-10-23
  ruling_by: 业务方

  air_conditioner:
    conflict:
      - code: E0
        ours: 室内机 EEPROM 参数错误（module, stop_and_call）
        biz: 环境温度 / 内机温度传感器故障
        severity_agree: partial
        reply: 断电 10 分钟重上电；仍显示则建单，只说"电控或传感器这类问题"
      - code: E1
        ours: 室内外机通信故障（comm, stop_and_call）
        biz: 环境温度 / 内机温度传感器故障
        severity_agree: no        # 通讯故障 ≠ 传感器故障，处置方向差很远
        reply: 先按说明书 p32 的断电流程走一遍；仍显示必须建单，不解释部件
        note: 装机后首次上电就报 E1，无论哪种释义都要优先怀疑连线，属安装返修
      - code: E5
        ours: 室外机 EEPROM 参数错误（module, stop_and_call）
        biz: 室外机通讯故障
        severity_agree: partial
      - code: E8
        ours: 室内 EEPROM 参数错误（module, stop_and_call）
        biz: 内机控制板通讯故障
        severity_agree: partial
      - code: E9
        ours: 开关门故障（带开关门面板的机型，attention）
        biz: 内机控制板通讯故障
        severity_agree: no
    biz_only:
      - {code: E4, cn: 室外机通讯故障, severity: stop_and_call, status: 未核实}
    biz_only_note: >
        业务方表把 E8 与 E9 写成同一个含义（"内机控制板通讯故障"），这是速查表常见的合并写法，
        本身就说明它的粒度低于本文件。所以空调段一律不采纳，继续用本文件做内部分诊。
    our_advantage: >
      本文件的美的空调代码表与官方说明书的代码族（E(x)/F(x)/P(x)/EH-EE/PH-PL-PC）是自洽的，
      业务方表里的 E4/E9 与这个族也对不上，进一步说明它不是美的空调的完整表。

  rice_cooker:
    matched:
      - {code: E1, cn: 底部传感器开路, note: 与本文件一致}
      - {code: E2, cn: 底部传感器短路, note: 与本文件一致}
    conflict:
      - code: E3
        ours: IGBT 传感器开路（sensor, stop_and_call）
        biz: 炉面 / 底部超温保护（有异物或干烧）
        severity_agree: partial
        reply: 先确认内锅底部与加热盘有无异物、是否干烧；仍报码则送修
        note: 两边处置其实可以合并——异物/干烧正是 IGBT 过温的常见成因
      - code: E6
        ours: 上盖传感器短路（sensor, stop_and_call）
        biz: 炉面 / 底部超温保护（有异物或干烧）
        severity_agree: partial
        reply: 同上
    note: >
      电饭煲的 E1/E2 可以直接对外说"底部传感器问题"；E3/E6 先说"先看内锅底有没有异物、
      是不是干烧了"，再说送修——这个顺序在两种释义下都成立。

  # ── 裁定结果（2026-10-23）──────────────────────────────
  adopt:
    - {table: rice_cooker, code: E1, cn: 底部传感器开路, note: 与现有表一致}
    - {table: rice_cooker, code: E2, cn: 底部传感器短路, note: 与现有表一致}
    - {table: air_conditioner, note: "F/P/EH/PH 等代码族速查表完全未覆盖，继续用现有表"}
  not_adopt:
    - {table: air_conditioner, code: E0, ours: 室内机 EEPROM 参数错误, biz: 环境温度/内机温度传感器故障}
    - {table: air_conditioner, code: E1, ours: 室内外机通信故障, biz: 环境温度/内机温度传感器故障}
    - {table: air_conditioner, code: E5, ours: 室外机 EEPROM 参数错误, biz: 室外机通讯故障}
    - {table: air_conditioner, code: E8, ours: 室内 EEPROM 参数错误, biz: 内机控制板通讯故障}
    - {table: air_conditioner, code: E9, ours: 开关门故障, biz: 内机控制板通讯故障}
    - {table: air_conditioner, code: E4, ours: 未收录, biz: 室外机通讯故障, action: 按"代码未收录"处理}
    - {table: rice_cooker, code: E3, ours: IGBT 传感器开路, biz: 炉面/底部超温保护}
    - {table: rice_cooker, code: E6, ours: 上盖传感器短路, biz: 炉面/底部超温保护}
  note: >
    电饭煲 E3/E6 虽然词面不同，但处置可以先合并成一句"先看内锅底有没有异物、是不是干烧"，
    这一步在两种释义下都成立，所以不冲突于话术，只冲突于内部分类。
    内部仍按 IGBT / 上盖传感器归类，以保证备件与工单字段一致。
