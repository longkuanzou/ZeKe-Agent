  - 电饭煲上门 vs 寄修的服务方式，各地不一致，需按区域确认

# ══════════════════════════════════════════════════════════════
# 保外维修分级人工费（2026-10-23 新增）
#
# 美的是唯一"金额带区间 + 标注视机型"的品牌，说明它的分级本来就不是硬价目表。
# 两个品类分开记：空调按挂机/柜机，电饭煲按工时费 + 配件区间。
repair_grade_labor:
  source_kind: biz_reference
  source: "业务方提供的空调/电饭煲保外维修收费标准参考（2026-10-23）"
  price_verified: false
  scope_note: 基础人工费，不含配件费与远程费；具体以当地官方售后网点实际报价为准

  air_conditioner:
    grades:
      - appliance: 挂机空调
        trip_inspection: {price_min: 50, price_max: 100}
        minor_adjust: {price_min: 80, price_max: 100}
        small_repair: {price_min: 150, price_max: 150}
        medium_major: {price_min: 300, price_max: 300, open_ended: true, note: 视机型上浮}
    note: >
      美的给了"视机型"这个开口，所以中修/大修不能报死 300。
      答"300 起，视机型上浮"，比答"300"安全。

  rice_cooker:
    labor_hours: {price_min: 30, price_max: 300}
    parts: {price_min: 100, price_max: 500}
    parts_scope: [主板, 内胆, 加热盘]
    note: >
      电饭煲按"人工工时 + 原厂配件"两块算，没有空调那种简修/小修分档。
      内胆和加热盘是最贵的两项，也是用户最常问的。

repair_grade_answer_rules:
  - 空调保外："上门检测 50~100，简修 80~100，小修 150 上下，中修大修 300 起视机型，配件另算"
  - 电饭煲保外："人工 30~300 看修什么，配件 100~500，主板/内胆/加热盘是大头"
  - 电饭煲用户问"修值不值" → 只给客观信息（人工+配件区间 vs 新机价），不劝退也不劝修
  - 严禁把"视机型"的开口省略掉，报成一个确定的数
