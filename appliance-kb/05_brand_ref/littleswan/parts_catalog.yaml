# 小天鹅洗衣机备件/耗材目录
# 报修建单时回答"师傅带什么件"，售前/使用回答"哪些件要自己买"
policy_id: brand.littleswan.parts_catalog
brand: littleswan
brand_cn: 小天鹅
applies_to: {appliance: [washer]}
verified: false
source: null
updated: 2026-10-23

consumables:            # 用户可自购/易损
  - key: inlet_hose
    cn: 进水管
    note: 随机附 1 根；加长属安装收费项
  - key: drain_hose
    cn: 排水管
    note: 上排水果汁机型的排水管高度要求 ≤100cm
  - key: pump_filter
    cn: 排水泵过滤网
    note: 排水超时的第一检查对象，用户可自行清理
  - key: detergent_box
    cn: 洗涤剂料盒
    note: 带自动投放机型才有；料盒未关到位会报 613
  - key: door_seal
    cn: 门封圈
    note: 发霉/破损需更换，属耗材性质，通常不在免费保修内

replaceable_parts:      # 建单选件用
  - key: door_lock
    cn: 门锁开关
  - key: water_inlet_valve
    cn: 进水阀
  - key: drain_pump
    cn: 排水泵
  - key: water_level_sensor
    cn: 水位传感器
  - key: pcb
    cn: 电脑板/主控板
  - key: motor
    cn: 电机
  - key: belt
    cn: 皮带（波轮/部分滚筒）
  - key: shock_absorber
    cn: 减震器
  - key: stacking_kit
    cn: 叠放支架（干衣机叠放用）

included_accessories:   # 说明书可确认的随机附件
  source: null
  note: 本批 5 份资料未列完整附件清单，不得承诺随机赠送品
  items: []

