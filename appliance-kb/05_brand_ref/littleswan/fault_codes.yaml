# ══════════════════════════════════════════════════════════════
# 业务方速查表交叉核对（2026-10-23 新增）
#
# 业务方给了一份《常见错误代码及含义速查表》。逐条与本文件比对后：
#   一致的 → 只提升可信度，不改含义
#   冲突的 → **不覆盖**。现有条目来自说明书或已建表，速查表没有说明机型平台，
#            直接替换会把已核对的值得冲掉。冲突项两边都留，对外话术退到"类别+处置"。
biz_crosscheck:
  source_kind: biz_provided
  source: "业务方提供的常见错误代码速查表（2026-10-23）"
  verdict: library_prevails          # partial_match（原描述，见下方 ruling）
  ruling_policy: >
    2026-10-23 业务方裁定：**凡与现有条目冲突的，一律以现有表为准**（速查表对应条目不采纳）。
    理由：速查表未标机型平台，现有表至少能追到说明书或可对照的官方代码族。
    本条裁定不改变 usable_scope——"采用哪一套"和"这套本身是否经售后核实"是两件事。
  ruling_date: 2026-10-23
  ruling_by: 业务方

  matched:                        # 一致，可据此在答复中直接给含义
    - code: E1
      cn: 进水超时
      note: 与 codes_web#E1 一致
    - code: E2
      cn: 排水超时
      note: 与 codes_web#E2 一致

  conflict:                       # 含义不同，禁止覆盖，只做内部对照
    - code: E4
      ours: 衣物不平衡（codes_web#E4）
      biz: 门未关好
      severity_agree: attention   # 严重度一致，只是归类不同
      reply: 对外只说"门没关好或衣物不平衡这类问题，先确认门是否关严、衣物抖散再试"
      forbid: 不得只按一种说法回答，也不得说"这是部件故障"
    - code: E8
      ours: 未收录
      biz: 水位传感器异常
      severity_agree: stop_and_call
      reply: 建单，工单里写"代码原文 E8"，不解释部件

  uncovered_by_biz:               # 业务方表里没有，但本文件有依据的，继续用本文件
    - {code: "630", note: 门未合上，说明书确认值，优先于任何速查表}
    - {code: "613", note: 料盒未关闭到位，说明书确认值}
    - {code: Ub, note: 不平衡保护提示，不建单}

  note: >
    小天鹅并存三套代码体系（3 位数字码 / E 码 / 字母提示），
    业务方速查表没有区分机型平台，所以冲突集中在 E 码区间。
    真正定版要等小天鹅售后出书面代码表，见 todo。

  # ── 裁定结果（2026-10-23）──────────────────────────────
  adopt:
    - {code: E1, cn: 进水超时, note: 与现有表一致，可直接用}
    - {code: E2, cn: 排水超时, note: 与现有表一致，可直接用}
  not_adopt:
    - {code: E4, ours: 衣物不平衡, biz: 门未关好, action: 按现有表分诊}
    - {code: E8, ours: 未收录, biz: 水位传感器异常, action: 按"代码未收录"处理：建单 + 记录代码原文}
  note: >
    E4 的两种说法在处置上差别不大（都先让用户查门和衣物），但对内归类要统一按"衣物不平衡"，
    否则 symptoms 映射会对不上 ws_vibration。
