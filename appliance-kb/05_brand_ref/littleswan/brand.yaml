notes:
  - 品牌层面说明书**没有**给整机包修年限，答复保修相关问题必须转 warranty.yaml，不得凭经验报"整机 1 年/电机 10 年"
  - 说明书把大量"用户以为坏了"的现象写进了常见问题页（门打不开、Ub、脱水延时、泡沫延时），
    这些是该品牌工单量最大的一块，见 fault_codes.yaml 的 normal_phenomena
  - 小天鹅是美的集团子品牌，但客服入口走的是小天鹅自己的 400-8228-228

