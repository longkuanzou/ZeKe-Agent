# 型号澄清（disambiguation）
# 客服错答的第一大来源就是"型号没确认就开始报参数"。这里是唯一的澄清入口。
# 注意：model_code_rules 按品类分开写，不同品类的编码规则毫无共性，
#       混在一张表里迟早会把洗衣机的 TG 当成空调的 GW 用。
version: 2
updated: 2026-10-22

# ── 一、型号编码自带信息 ──
model_code_rules:

  # GB/T 7725 房间空调器命名规则
  air_conditioner:
    pattern: "^KFR?-(\\d{2})(G|L)W"
    fields:
      K: 房间空气调节器
      F: 分体式
      R: 热泵型（可制冷制热）
      "35": 额定制冷量 3500W（≈行业口语"1.5匹"）
      G: 室内机为挂壁式（口语"挂机"）
      L: 室内机为落地式（口语"柜机"）
      W: 室外机
    capacity_to_hp:
      "23": 1匹
      "26": 大1匹
      "35": 1.5匹
      "50": 2匹
      "72": 3匹
    caveat: 匹数是行业口语，不参与任何计算；参数一律以 W 为准

  # 洗衣机没有国标统一编码，各品牌自说自话。以下只覆盖库里已有的品牌。
  # 用途仅限"缩小候选范围"，不得据此直接报容量——容量一律以说明书为准。
  washer:
    littleswan:
      pattern: "^([TW])([BGMNQ])(\\d{2,3})"
      fields:
        T: 波轮（顶开式）
        W: 滚筒（前开式）
        TG: 滚筒洗衣机
        TB: 波轮洗衣机
        TG\1\d{3}: 常见为 10kg 机型，但必须核对说明书
        V/数字段: 系列代号（如 V618 / V628 / VE40），不代表容量
      caveat: 小天鹅同容量存在多个系列代号，系列代号不影响容量，只影响功能配置
    siemens:
      pattern: "^(W[GMNQ])(\\d{2})([A-Z])(\\d)"
      fields:
        WM: 滚筒洗衣机
        WG: 滚筒洗衣机（新一代命名，WG/WM 常并存）
        WN: 洗干一体机（wash + dry）
        WQ: 干衣机（热泵）
        "\\2": 系列/平台代号，非容量
      caveat: 西门子型号里不编码容量，容量必须查说明书；WN 洗干容量与洗涤容量不同，必须分别说
    bundle_note: 型号里出现 "+" 表示套装（如 WQ53E2D01W+WQ53E2D11W 为两台干衣机），
      共用一份说明书，参数可能不同——不得合并成一个数回答

  # 电饭煲：数字段多为容积（40→4L），但同一品牌也有例外，仅用于缩小范围
  rice_cooker:
    midea:
      pattern: "^MB-?([A-Z]{0,3})(\\d{2})(\\w*)"
      fields:
        MB: 美的电饭煲
        "\\2": 常见为容积×10（40→4L、50→5L），但仅在 30~60 且整十时可信
      caveat: MB-RE576S 这类 5 开头的三位数不按上述规则解析，必须查说明书
    supor:
      pattern: "^S?F(\\d{2})(\\w*)"
      fields:
        F: 苏泊尔电饭煲（SF/FC/FC871 等后缀为系列）
        "\\2": 常见为容积×10（40→4L、50→5L）
      caveat: 苏泊尔后缀（H8093S / X96 / FC871 / FC733）区分加热方式（IH/底盘）与内胆，
        同容积不同后缀不可互套参数

# ── 二、用户只说到品类时怎么收敛 ──
resolve_steps:
  common_1_ask_for_label:
    say: 麻烦拍一张机身侧面或底部的型号标签，我照着给您查准确的。
    why: 标签上有完整型号与生产日期，一次到位，比追问五句都快
  common_2_ask_from_order:
    say: 您是在我们这下单的吗？我按订单里的型号帮您看。
    when: 售后/报修场景优先走这条，可同时拿到下单日期
  air_conditioner_3_narrow_by_form:
    say: 是挂墙上的，还是立在地上那种柜机？
    when: 用户只能描述形态
    map: {挂墙/贴墙/壁挂: GW, 立式/落地/柜机: LW}
  air_conditioner_4_narrow_by_capacity:
    say: 房间多大？大概 15 平以内还是 25 平左右？
    map: "≤15㎡ → 26/35 档；20~30㎡ → 50/72 档"
  washer_3_narrow_by_form:
    say: 是从上面开盖放衣服的，还是前面有个圆门？
    map: {顶开/上面开盖: 波轮(TB), 前开/圆门/滚筒: 滚筒(TG/WM/WG)}
  washer_4_narrow_by_capacity:
    say: 家里几口人？大概一次洗多少件？
    map: "1~2人 → 8kg 以内；3~4人 → 10kg；洗被子/四件套 → 10kg 及以上"
  rice_cooker_3_narrow_by_capacity:
    say: 家里几口人吃饭？平时煮几杯米？
    map: "1~2人 → 3L；3~4人 → 4L；5人以上 → 5L 及以上"

# ── 三、候选集处理规则 ──
candidate_policy:
  max_show: 3
  only_when: 用户明确表示"哪个都行/你推荐"
  forbid: 在未确认型号前给出具体参数值（会给错，且用户会记住错的那个）
  template: |
    这个品类我们有几款，参数差别主要在能效和功能上。
    您方便发一下机身标签，或者告诉我想要几级能效 / 几公斤，我帮您定一台？

# ── 四、常见混淆对（必须分清，答错即事故）──
confusable_pairs:
  - pair: [KFR-35GW/E1-1, KFR-35GW/E1-1Plus]
    reason: 同系列 Plus 版，参数接近但功能/能效可能不同
    rule: 必须按完整后缀区分，不得互套参数
  - pair: [KFR-35GW/Q2, KFR-35GW/KS2P, KFR-35GW/N8KS1-1P, KFR-35GW/A11]
    reason: 同为 1.5 匹挂机，但自清洁/能效/APP 支持不同
    rule: 售前对比只能用同一 compare_group 内的型号，且逐项标注来源
  - pair: [挂机, 柜机]
    reason: 安装条件（外机位置、承重、电源）完全不同
    rule: 未确认形态前不给安装建议
  - pair: [滚筒, 波轮]
    reason: 门宽、进排水、能否嵌入、能否热水洗，全部不同
    rule: 未确认形态前不谈安装与"能不能放卫生间"
  - pair: [WN54A1X42W, WG54H2V00W]
    reason: 西门子 WN 是洗干一体、WG 是单洗，干衣容量只有 WN 有
    rule: 用户问"能不能烘干"必须先确认是 N 还是 G
  - pair: [TG10K60, TG10V628PLUS, TG100V618PLUS]
    reason: 同为 10kg 滚筒，系列不同（功能/程序/联网）不同
    rule: 容量可共用，功能一律按各自型号回答
  - pair: [F40H8093S, F40H9083S]
    reason: 同 4L、同品牌，加热方式/内胆可能不同（IH vs 底盘）
    rule: 不得互套"是否 IH""内胆材质"
  - pair: [SF40FC871, F40H8093S]
    reason: 苏泊尔 SF 与 F 是两个系列，程序与配件不同
    rule: 配件/内胆型号不通用

# ── 五、"型号对不上"的兜底 ──
mismatch:
  when: 用户报的型号在 03_product 中不存在
  do:
    - 不猜、不套用相似型号参数
    - 记录到 10_ops/backlog.md（这是选品/资料缺口信号）
    - 回复：这个型号我这边暂时没有完整资料，我先帮您登记，确认后回复您
