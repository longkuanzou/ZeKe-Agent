# 洗衣机安装收费：四品牌横向对比（2026-10-23 业务方提供《洗衣机安装收费标准对比》）
#
# 用途：回答"洗衣机安装要不要钱""加长管多少钱""改地漏怎么收"这类问题。
# 库内只有小天鹅与西门子两个洗衣机品类，海尔/美的两列保留在基准表里，
# 是为了在用户跨品牌比价时能给出"行业内大概什么水平"，**不能**当成那两个品牌的口径。
policy_id: platform.install_fee_benchmark
applies_to: {appliance: [washer]}
category: 安装收费基准（横向对比）
source_kind: biz_provided
source: 洗衣机安装收费标准对比.xlsx（业务方 2026-10-23 提供，2024~2026 公开数据整理）
verified: false
price_verified: false
price_basis: >
  各品牌官网公开信息与行业数据整理；区间为市场价，实际以当地官方售后网点报价为准。
  部分辅材需通过官方客服或小程序按型号查询，本表给的是"要不要收、大概什么水平"，不是报价单。
updated: 2026-10-23

# ── 先立一条总口径，这条比任何单价都重要 ──────────────
definition_of_free_install:
  included:
    - 上门
    - 拆箱
    - 摆位
    - 接基础进排水管
    - 通电调试
    - 使用讲解
  excluded:
    - 加长进水管 / 排水管
    - 水龙头（含自备龙头的新装服务费）
    - 排水三通 / 改地漏
    - 滚筒底座 / 支架
    - 移机 / 拆旧机
    - 高空作业（洗衣机较少涉及）
    - 远程交通费
  rule: 「免费安装」只免人工，不免辅材与增值服务。回答必须先说这句，再谈具体项目。

items:
  - item: 上门费
    haier: 50 元/次
    littleswan: 首次安装免费
    midea: 首次安装免费
    siemens: 50 元（15km 内），超 15km 加 2 元/km
    industry: 官方首次安装多免上门费；二次安装/超保修期收费

  - item: 基础安装人工（含调试/讲解）
    haier: 免费（标准安装）；调试费 60 元/次单列
    littleswan: 免费（首次），含调试与讲解
    midea: 免费（基础安装），含调试与讲解
    siemens: 免费（购机 3 年内首次）；超 3 年收 50 元（安装/拆机）
    industry: 「免费安装」通常只免人工，辅材另收

  - item: 拆包装 / 拆机
    haier: 含在基础安装内
    littleswan: 含在基础安装内
    midea: 含在基础安装内
    siemens: 50 元（安装/拆机）
    industry: 首次安装通常含拆箱摆位

  - item: 拆旧机 / 移机
    haier: 移机费 70 元/台（滚筒）
    littleswan: 移机 70~100 元/台（行业参考）
    midea: 移机 70~100 元/台（行业参考）
    siemens: 拆机 50 元 + 拉运费起步 110 元
    industry: 拆旧 + 装新全套 150~300 元

  - item: 加长进水管
    haier: 原机配免费；加长 0.5m/15 元、1m/20~25 元、2m/30~35 元
    littleswan: 25 元/米或根
    midea: 25 元/米或根
    siemens: 配件费另计（需官方客服查询）
    industry: 10~30 元/米；建议自备水管更省

  - item: 加长排水管
    haier: 原机配免费；波轮 1.5m/5 元；滚筒 10 元/根，个别 25 元/根
    littleswan: 26 元/米或根
    midea: 49 元/米或根
    siemens: 配件费另计
    industry: 10~30 元/米；通常 2~3 米够用

  - item: 改地漏 / 排水整改
    haier: 地漏三通/多通 30 元/个（含辅材）
    littleswan: 排水三通 50 元/个
    midea: 排水三通 50 元/个；防臭地漏 68 元/个
    siemens: 排水整改 170 元（增值服务）
    industry: 20~50 元；西门子官方整改明显贵

  - item: 水龙头更换
    haier: 新装/换装 12 元/个（含辅材，不含龙头）；专供龙头 46 元、精品 65 元
    littleswan: 自备龙头新装收 12 元服务费；官方普通龙头 49 元、高端 78 元
    midea: 同小天鹅
    siemens: 配件费另计
    industry: 30~80 元；建议自备 4 分口径专用龙头

  - item: 滚筒底座 / 支架
    haier: 滚筒加长底脚 20 元/套
    littleswan: 滚筒架 108 元/套
    midea: 滚筒支架（大脚）108 元/套
    siemens: 配件费另计
    industry: 78~108 元；阳台地面不平建议配

  - item: 远程交通费
    haier: 单程 ≤20km 免费；20~80km 收 50 元；>80km 收 100 元
    littleswan: 以官方公布为准
    midea: 以官方公布为准
    siemens: 单程起步 110 元，超 15km 加 2 元/km
    industry: 各品牌差异大，报修前先确认

answer_rules:
  - 先讲 definition_of_free_install，再谈具体项目，否则用户会以为"免费安装"= 全免
  - 库内可对外报的是小天鹅与西门子两列；海尔/美的两列只能以"行业参考"口吻出现
  - 用户问"安装要多少钱" → 答"基础安装免费，辅材按项目收"，然后列 1~2 个最可能产生的项目
  - 西门子的辅材多为"配件费另计"，不要凭海尔的价去填
  - 建议用户自备进水管/水龙头/三通，可省 50% 以上；这是实话，可以说

forbid:
  - 把海尔/美的的安装单价当成小天鹅或西门子的口径
  - 承诺"安装全免费"
  - 给安装总价（辅材按现场实测，无法预估总价）
