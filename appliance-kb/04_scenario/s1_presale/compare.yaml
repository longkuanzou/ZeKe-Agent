# s1 对比组与对比表（三品类）
#
# ── 2026-10-23 改版 ────────────────────────────────────
# 旧版只有空调两个对比组，洗衣机与电饭煲虽然各有 10 / 8 个型号，
# 但用户问"这两台差在哪"时无表可查。现在按 appliance 分开组织。
#
# 规则没变：只在同组内对比；缺值显示"未标注"，不填空、不用同系列替代。
# 数值来自 03_product/{appliance}/*/specs.yaml 与 features.yaml（2026-10-23 快照）。
# 改型号参数后，跑 `python tools/dump_compare.py` 打印当前值对照本表——不要凭记忆改。
version: 2
updated: 2026-10-23

# 表内取值口径（cells 的标注规则）：
#   不标注            = 说明书原文值（confidence: confirmed）
#   标（推断）        = 说明书缺项、按同系列/铭牌反推，回答时必须同步说"这个是推断"
#   标（网络值）      = 来自官网/电商详情页，非说明书；用户要凭证时说明来源
#   未标注（文字）    = 说明书里确实没有这项，禁止用同系列其他机型代填
# 不要把"未标注"写成"无"：查不到 ≠ 没有。

# 三品类的"可比"边界完全不同，先写清楚，避免跨品类凑对比
comparability:
  air_conditioner: 按制冷量档位（1.5 匹 / 3 匹）+ 形式（挂机 / 柜机）分组
  washer:         按容量（10kg）+ 结构（滚筒 / 波轮）分组；洗烘一体与纯干衣机单独成组
  rice_cooker:    按容量（4L / 5L）分组；IH 与底盘加热可在同组比，但要说明这是加热方式差异不是优劣

appliances:

  # ══════════════════════════════════════════════════ 空调
  air_conditioner:
    groups:
      s1_1.5p_wall:
        cn: 1.5 匹挂机
        members: [haier-kfr-35gw-e1-1, midea-kfr-35gw-q2]
        selection_rule: 制冷量 3500W 档、分体挂壁式
      s1_3p_floor:
        cn: 3 匹柜机
        members: [haier-kfr-72lw-e1-1, midea-kfr-72lw-n8ks1-1p]
        selection_rule: 制冷量 7200W 档、落地式柜机
        # 2026-10-23 解除 pending；同一天业务方出了两处**核定结论**，两台的取值来源因此不同：
        #   海尔 尺寸 → 核定 424×1830×364（官方知识库 + 苏宁自营规格页一致），说明书 p35 的
        #              364×1830×424 判为表格列序问题，已在 specs 里降为 cross_check_alt
        #   美的 风量 → 核定 1760m³/h（本机是新款「酷省电Ultra」，说明书沿用的 1600 是旧款
        #              「舒适星」数据），已在 specs 里降为 cross_check_alt
        # 所以本表的「说明书值」这一层口径已被打破：这两行的值是核定值，不是说明书原文。
        # 走查时看 cells 来源，别默认「表里没标注 = 说明书值」。
        dimensions_extra:
          - {key: size_indoor_mm, cn: 室内机尺寸(宽×深×高), unit: mm, priority: 1}
          - {key: airflow_m3h, cn: 循环风量, unit: m³/h, priority: 1}

    dimensions:
      - {key: cooling_capacity_w, cn: 制冷量, unit: W, priority: 1}
      - {key: heating_capacity_w, cn: 制热量, unit: W, priority: 1}
      - {key: energy_grade, cn: 能效等级, unit: 级, priority: 1}
      - {key: cooling_power_w, cn: 制冷功率, unit: W, priority: 2}
      - {key: noise_indoor_db, cn: 室内噪音(静音档), unit: dB(A), priority: 2}
      - {key: min_room_area_m2, cn: 最小房间面积, unit: m², priority: 2}
      - {key: max_input_current_a, cn: 最大输入电流, unit: A, priority: 3}
      - {key: pipe_max_length_m, cn: 最大管长, unit: m, priority: 3}
      - {key: refrigerant_extra_per_m, cn: 加长补冷媒, unit: g/m, priority: 3}
      - {key: feature_self_clean, cn: 自清洁, priority: 2}
      - {key: feature_wifi, cn: WiFi, priority: 3}

    tables:
      s1_1.5p_wall:
        haier-kfr-35gw-e1-1:
          cooling_capacity_w: "3510（150~5350）"
          heating_capacity_w: "5110（150~7000）"
          energy_grade: "未标注"
          cooling_power_w: "840（80~1780）"
          noise_indoor_db: "16"
          min_room_area_m2: ">4"
          max_input_current_a: "未标注"
          pipe_max_length_m: "10"
          refrigerant_extra_per_m: "20（超 5m 后）"
          feature_self_clean: "有（除菌自清洁）"
          feature_wifi: "有（智家 App）"
        midea-kfr-35gw-q2:
          cooling_capacity_w: "3510（150~5250）"
          heating_capacity_w: "5010（150~6790）"
          energy_grade: "1 级"
          cooling_power_w: "845（70~2050）"
          noise_indoor_db: "18"
          min_room_area_m2: "≥4"
          max_input_current_a: "15.0"
          pipe_max_length_m: "15"
          refrigerant_extra_per_m: "18（每米）"
          feature_self_clean: "无"
          feature_wifi: "有（美居 App）"
      s1_3p_floor:
        haier-kfr-72lw-e1-1:
          cooling_capacity_w: "7330（850~9270）"
          heating_capacity_w: "9820（850~12420）"
          energy_grade: "未标注"
          cooling_power_w: "2070（250~3550）"
          noise_indoor_db: "20（最高 47）"
          min_room_area_m2: "未标注"
          max_input_current_a: "未标注"
          pipe_max_length_m: "15"
          refrigerant_extra_per_m: "未标注"
          feature_self_clean: "有（除菌自清洁）"
          feature_wifi: "有（智家 App）"
          size_indoor_mm: "424×364×1830"
          airflow_m3h: "1600"
        midea-kfr-72lw-n8ks1-1p:
          cooling_capacity_w: "7320（900~9260）"
          heating_capacity_w: "9760（900~12380）"
          energy_grade: "1 级"
          cooling_power_w: "2080（推断）"
          noise_indoor_db: "22（最高 47）"
          min_room_area_m2: "26"
          max_input_current_a: "未标注"
          pipe_max_length_m: "20"
          refrigerant_extra_per_m: "未标注"
          feature_self_clean: "未标注"
          feature_wifi: "有（美居 App）"
          size_indoor_mm: "380×392×1802"
          airflow_m3h: "1760（核定）"

    conclusions:
      - when: 用户在意能效/电费
        say: 美的 Q2 明确标了 1 级能效、APF 5.32；海尔这台说明书没标能效等级，要确认只能看机身能效标识。只看纸面的话，Q2 这块更清楚。
      - when: 用户在意安装位置受限（外机位远）
        say: 管路这块差别比较大：Q2 最长可加长到 15 米、每米补 18g 冷媒；海尔最长 10 米、超 5 米每米补 20g。外机位离得远的话 Q2 选择余地更大。
      - when: 用户在意安静
        say: 静音档海尔是 16dB(A)，美的 18dB(A)，都在很低的水平，体感差别不大，不建议只凭这 2dB 做决定。
      - when: 用户要自清洁
        say: 只有海尔这台有自清洁；美的 Q2 没有，需要自己拆洗滤尘网。
      - when: 用户纠结两台 3 匹柜机怎么选（KFR-72LW/E1-1 vs KFR-72LW/N8KS1-1P）
        say: 制冷制热能力几乎一样（7330/9820 对 7320/9760），能效都是 1 级。真正的差别两条：一是电费口径，海尔说明书没标 APF，美的标了 4.6；二是管路——美的最长 20 米，海尔 15 米，外机位远的话美的更宽松。
      - when: 用户问 3 匹柜机能不能放进预留位
        say: 两台室内机都不小：海尔 424×364×1830、美的 380×392×1802（宽×深×高）。宽都在 38~43cm、深 36~40cm，最容易卡在门套和柜体上，先量好再定，别只看制冷量。散热和接管还要另留 5cm 以上。
      - when: 用户问两台 3 匹柜机风量差多少
        say: 海尔 E1-1 是 1600m³/h，美的 N8KS1-1P 是 1760m³/h，美的这台大约高 10%。风量影响的是送风距离和整个厅的循环速度，大横厅、柜机离人远的话这 160 有感知；小厅差别不明显。
      - when: 用户问 3 匹柜机要多大房间
        say: 美的说明书明确写了使用房间最小面积 26㎡（低于此不建议）、制冷推荐 32~48㎡；海尔的说明书既没写最小面积也没写推荐面积，不要替它编一个数字，只能说"3 匹柜机一般对应 30㎡ 以上的厅"这类常识话，并说明这是经验不是说明书值。

