    conclusions:
      - when: 用户问"4L 这几台差在哪"
        say: 先分加热方式：MB-40HB9T 是 IH（1300W），其余是底盘加热（750~760W），苏泊尔两台底盘加热但顶部加了远红外（1600W）。口感差别主要在受热均匀度，不是"哪个牌子更好"。再分内胆：想不粘选涂层胆（AFB4041RL 特氟龙、SF40FC871 蓝钻），不想有涂层顾虑选纯钛（苏泊尔两台）。尺寸差最多 2cm，橱柜要按大的那台算。
      - when: 用户问 5L 三台怎么选
        say: 三台都是底盘加热 750~760W，差别在内胆和功能：MB-RE576S 是 316L 不锈钢零涂层（可以用钢丝球）；SF50FC733 是 1.5mm 球釜+陶瓷涂层、预约能到 24 小时；F50X96 带蒸汽水杯和微压，但内胆材质说明书没指定、尺寸也查不到，放橱柜前必须实测。
      - when: 用户问 IH 值不值得加钱
        say: IH 功率高（1300W vs 760W），升温快、受热均匀，但真实口感差别跟米和水比是次要的。预算有限优先选水位刻度清楚的机型，比追 IH 更影响每天的结果。
      - when: 用户问"能不能用钢丝球"
        say: 按机型分：316L 不锈钢零涂层（MB-RE576S）可以；涂层内胆（AFB4041RL、SF40FC871、SF50FC733）不行，会刮花。纯钛（苏泊尔两台）也不建议用钢丝球。
      - when: 内胆材质在说明书里查不到
        say: 这台说明书没标内胆材质，我不替它补。您可以看内锅上的丝印或包装说明，或者我按型号问一下配件口径再回您。

# 通用禁令（三品类都适用）
forbidden:
  - 用"综合性能更强""性价比更高"作结论
  - 跨 compare_group 对比（如 1.5 匹挂机 vs 3 匹柜机比参数、4L vs 5L 比容量）
  - 跨品类对比（空调 vs 洗衣机 vs 电饭煲之间没有任何可比维度）
  - 对 status: pending / single 的组出对比表
  - 用"未标注"的值参与结论（缺数据时只能说"这项没写"，不能反推优劣）
