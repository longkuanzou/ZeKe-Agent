      - when: 用户纠结西门子 3 台怎么选
        say: 三台机身尺寸完全一致（598×590×848），洗涤容量都是 10kg。区别是：WG54H2V00W 脱水噪音最低（69dB）、WG52A108AW 噪音略高（72dB）、WM12P2602W 的说明书没有给能效和噪音数据。功率上 WM12P2602W 是 2100W，另两台 1900W。数据不全的那台我不替它补。
      - when: 用户问"滚筒还是波轮"
        say: 这是结构选择不是优劣：滚筒省水、对衣物磨损小、能嵌入柜体，但要弯腰、机身重（63~79kg）；波轮取放方便、价格低、程序简单，但费水、磨损大，机身也高（930mm）。您家里是谁洗衣服、放哪儿，比参数更决定选哪个。
      - when: 用户问洗烘一体和分开买
        say: 洗烘一体的烘干容量小于洗涤容量（西门子这台洗 10kg、烘 7kg），一次洗满就得分成两次烘；分开买干衣机烘干容量能到 10kg，但要多占一台的位置和一路电。阳台空间够、常烘的建议分开。
      - when: 用户问"深度 560 和 590 差别大吗"
        say: 差 3cm 在标准 60cm 柜体里就是能不能嵌进去的差别，而且还要留进出水和散热间隙。量柜子时按机身深度加 3~5cm 余量算，别按机身尺寸刚好塞。

