# 转人工 / 转工单 判定规则
# 原则：能自助解决的绝不上转，但触发条件是硬性的——命中即转，不许"再问两句看看"。
version: 2
updated: 2026-10-23

priority_0_safety:        # 命中即转，不设次数门槛
  - name: 安全类现象
    when: [冒烟, 焦味, 漏电, 麻手, 频繁跳闸, 制冷时漏水, 异常金属异响]
    to: 人工坐席（同时建议停机）
    sla: 立即
    log: 必须记录，作为质量与合规留痕
  - name: 用户已自行拆机
    when: 用户表示已打开机壳/动过线路
    to: 人工坐席 + 工单
    note: 此时代答任何自查步骤都可能被认定为引导不当

priority_1_must_transfer:
  - name: 代码未收录
    when: 用户报的故障码在 05_brand_ref/{brand}/fault_codes.yaml 无记录
    to: 工单（标注"代码未收录"）
  - name: 品牌无代码表
    when: 该型号 faults.yaml 的 codes.has_code_display 为 null 且用户报了代码
    to: 工单
  - name: 政策类不确定
    when: 涉及金额>0 的退换/赔付，且对应政策 verified=false
    to: 人工坐席
    note: 不许估算金额、不许口头承诺
  - name: 保修资格争议
    when: 无发票 / 凭证涂改 / 疑似人为损坏 / 超保
    to: 人工坐席
  - name: 投诉与升级
    when: [要求赔偿, 提到投诉/12315/媒体, 二次返修, 情绪激烈]
    to: 人工坐席（升级）
  - name: 安装条件不达标但用户坚持
    when: 最小面积/接地/消防通道不满足而用户要求"先装"
    to: 人工坐席，禁止自行答应

priority_2_after_attempts:
  - name: 自查两轮未解决
    when: 已给出 2 轮自查建议仍无效
    to: 工单
  - name: 需要上门才能判断
    when: 涉及 [加冷媒, 检漏, 换件, 电路, 拆装]
    to: 工单
  - name: 用户明确要求人工
    when: 用户说"转人工/找真人"
    to: 人工坐席
    note: 第 1 次请求即转，不做挽留

never_transfer_without_asking:   # 这些可以先自助，但要说清边界
  - 滤网清洁（先给步骤，用户拒绝再转）
  - 遥控器无反应（先换电池）
  - APP 连不上（先查 2.4GHz）
  - 洗衣机 Ub / 脱水延时（先按偏心保护解释，加衣物再试）
  - 电饭煲检锅不加热（先确认内锅有没有放平）

# ── 品类专属的立即上转条件（2026-10-23 新增）──────────
# 加了洗衣机和电饭煲之后，安全类之外又多了几种"不能自己判"的情况。
appliance_specific:
  washer:
  - name: 底座积水 / AquaStop 报警
    when: 面板报 E23 类底水检测代码，或机身下方有水
    to: 工单（同时指导关水龙头 + 断电）
    note: 真漏水信号，禁止让用户复位后继续用
  - name: 门打不开且已过安全时间
    when: 程序结束 5 分钟后仍无法开门，或听到门锁反复动作
    to: 工单
    note: 禁止引导撬门或拆门锁
  - name: 运输螺栓未拆导致震动
    when: 用户是新装机且未拆运输螺栓
    to: 工单（按安装返修处理，不走换机）
  - name: 保修年限无法确认
    when: 用户问包修几年，且该品牌 warranty.yaml 的 duration 为 null
    to: 人工坐席 / 保修专员
    note: 小天鹅与西门子的说明书都没有写年限，这是已确认的缺口，不许按经验报
  rice_cooker:
  - name: 内胆涂层脱落
    when: 用户确认涂层起泡/脱落
    to: 工单 + 提醒停止使用
    note: 先分清是使用不当（钢丝球/洗碗机）还是质量问题，判定要师傅看实物
  - name: 微压机型锅内仍有压力打不开
    when: 用户说盖打不开且有泄压声
    to: 不转，先指导等自然泄压
    note: 强行开盖是烫伤事故，属于话术红线不是工单问题
  - name: 报传感器/通信/模块类代码
    when: 命中 fault_codes.yaml 中 class 为 sensor/comm/module 的条目
    to: 工单（送修，不上门）
    note: 小家电以送修为默认模式，别承诺"师傅马上到"

# 转接时必须带过去的上下文（缺一项，人工要重新问一遍，体验直接崩）
handoff_payload:
  required: [appliance, product_model, intent, 已尝试的自查项, 用户原话关键词]
  optional: [error_code, order_channel, warranty_status, 历史工单]
  never: [完整手机号明文, 身份证, 完整地址明文]   # 脱敏后传递

# 话术
scripts:
  to_human: 这个情况我帮您转给专门的同事跟进，您刚才说的情况我已经一起带过去了，不用再重复一遍。
  to_ticket: 我这边先帮您登记一台检修，师傅会在 24 小时内联系您确认上门时间。麻烦确认下地址和电话。
  safety: 先别开机了，把电源断掉。这种情况需要师傅上门看，我帮您登记。
