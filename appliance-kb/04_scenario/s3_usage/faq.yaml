faq:
- id: faq-s3.001
  question: 第一次使用怎么操作
  intent: usage.first_time
  scope:
    appliance: air_conditioner
  answer: '装好后师傅会完成试机，之后您自己用就四步：

    1. 插上电源，遥控器装好电池

    2. 按开关键开机

    3. 选模式（凉快选制冷，冬天选制热）

    4. 调温度和风向，制冷时导风板朝上，制热朝下

    '
  source: 03_product/*/usage.yaml#first_use
  verified: true
- id: faq-s3.002
  question: 滤网怎么清洗
  intent: usage.maintenance
  scope:
    appliance: air_conditioner
    model:
    - midea-kfr-35gw-q2
  answer: '1. 先关机断电

    2. 双手抓住面板两端下侧的扣手位，把面板打开约 75 度卡住

    3. 抬起滤尘网中间的凸部，往下拉出来

    4. 温水加中性洗涤剂洗，放阴凉处晾干…详见 midea-kfr-35gw-q2 的 usage.yaml（maintenance）。'
  source: 03_product/air_conditioner/midea/KFR-35GW-Q2/usage.yaml#maintenance
  verified: true
