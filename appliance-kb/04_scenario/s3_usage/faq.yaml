  answer: 说明书建议两周左右清洗一次。详见 haier-kfr-35gw-e1-1 的 usage.yaml（maintenance.过滤网）。
  source: 03_product/air_conditioner/haier/KFR-35GW-E1-1/usage.yaml#maintenance.过滤网
  verified: true
