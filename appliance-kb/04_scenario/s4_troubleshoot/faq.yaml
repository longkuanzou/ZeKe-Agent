faq:
- id: faq-s4.001
  question: 空调不制冷
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 先按三步排一下：① 模式是不是在"送风"（送风不制冷）；② 设定温度是不是比室温低；③ 滤网是不是该洗了。详见 症状库 symptoms.yaml#not_cooling。
  steps:
  - 切到制冷模式
  - 调低设定温度
  - 清洗滤网
  source: 04_scenario/s4_troubleshoot/symptoms.yaml#not_cooling
  handoff:
    needed: true
    reason: self_check_failed
  verified: true
- id: faq-s4.002
  question: 显示 E1 是什么故障（美的）
  intent: troubleshoot.code
  scope:
    appliance: air_conditioner
    brand:
    - midea
  answer: 说明书里只说明 E/F/P 开头是故障代码，没有给具体每个代码的含义，这个我不跟您猜。详见 midea-kfr-35gw-q2 的 faults.yaml（codes）。
  steps:
  - 关机断电
  - 等待 10 分钟
  - 上电开机
  - 仍显示则报修
  source: 03_product/air_conditioner/midea/KFR-35GW-Q2/faults.yaml#codes
  handoff:
    needed: true
    reason: code_persist
  verified: true
