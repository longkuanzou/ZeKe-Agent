- id: faq-s4.013
  question: 洗衣机不脱水 / 脱不干
  intent: troubleshoot.symptom
  scope:
    appliance: washer
  answer: 先看三种情况：① 衣物太少或只有一件大件，机器怕偏心会先低速转一转再重新抖散，这是保护不是坏；② 筒里还有水，排水没完成就不会进脱水；③ 洗的时候泡沫多，程序会…详见
    症状库 symptoms.yaml#ws_no_spin。
  steps:
  - 调整衣物数量与分布
  - 确认已排完水
  - 关好门听到锁合声
  source: symptoms.yaml#ws_no_spin
  handoff:
    needed: true
    reason: need_diagnose
  verified: true
- id: faq-s4.014
  question: 洗衣机震动特别大 / 会跑位
  intent: troubleshoot.symptom
  scope:
    appliance: washer
  answer: 新装的机器，第一位要确认背面那 4 颗运输固定螺栓拆了没有——没拆就脱水，机器会剧烈晃动甚至移位，这属于安装遗漏，可以申请返修。详见 症状库 symptoms.yaml#ws_vibration。
  steps:
  - 确认运输螺栓已拆除
  - 对角线按压检查是否水平
  - 调平并锁紧底脚
  source: symptoms.yaml#ws_vibration
  handoff:
    needed: true
    reason: install_issue
  verified: true
- id: faq-s4.015
  question: 洗衣机不排水 / 水排不出去
  intent: troubleshoot.symptom
  scope:
    appliance: washer
  answer: 上排水的机型先查两件事：排水管末端是不是高过 1 米了（高了泵顶不上去），以及末端是不是泡在排出来的水里（会回流）。详见 症状库 symptoms.yaml#ws_no_drain。
  steps:
  - 把排水管末端降到 1 米以内
  - 理顺管路避免弯折
  - 清理排水泵滤网
  source: symptoms.yaml#ws_no_drain
  handoff:
    needed: true
    reason: need_diagnose
  verified: true
- id: faq-s4.016
  question: 洗衣机门打不开
  intent: troubleshoot.symptom
  scope:
    appliance: washer
  answer: 先别硬拉。详见 症状库 symptoms.yaml#ws_door_stuck。
  steps:
  - 等程序结束
  - 完成排水
  - 断电重启后等待解锁
  source: symptoms.yaml#ws_door_stuck
  handoff:
    needed: true
    reason: door_lock
  verified: true
- id: faq-s4.017
  question: 电饭煲煮出来的饭夹生 / 不熟
  intent: troubleshoot.symptom
  scope:
    appliance: rice_cooker
  answer: 这一类九成不是机器坏。详见 症状库 symptoms.yaml#rc_not_cooked。
  steps:
  - 按水位线加水
  - 选对米种功能
  - 擦干内锅底与加热盘
  - 装好蒸汽阀
  source: symptoms.yaml#rc_not_cooked
  handoff:
    needed: true
    reason: need_diagnose
  verified: true
- id: faq-s4.018
  question: 电饭煲溢锅 / 米汤溢出来了
  intent: troubleshoot.symptom
  scope:
    appliance: rice_cooker
  answer: 最常见是水超了刻度，或者用"煮饭"键去煮粥——煮粥得用粥/稀饭功能，火力和防溢逻辑不一样。详见 症状库 symptoms.yaml#rc_overflow。
  steps:
  - 按粥类水位线加水
  - 换煮粥功能
  - 清洁防溢电极与蒸汽阀
  source: symptoms.yaml#rc_overflow
  handoff:
    needed: true
    reason: need_diagnose
  verified: true
- id: faq-s4.019
  question: 电饭煲插上电不加热 / 灯不亮
  intent: troubleshoot.symptom
  scope:
    appliance: rice_cooker
  answer: 先三步：① 换个插座试，看电源线有没有破损；② 内锅放进去要转一下让它贴合（没放内锅或没放平，机器会检锅保护不加热，这不是故障）；③ 上盖要合到位，有的机型盖没…详见
    症状库 symptoms.yaml#rc_no_heat。
  steps:
  - 换插座测试
  - 确认内锅放平
  - 确认上盖合到位
  source: symptoms.yaml#rc_no_heat
  handoff:
    needed: true
    reason: no_heat
  verified: true
- id: faq-s4.020
  question: 面板显示故障代码怎么办
  intent: troubleshoot.code
  scope:
    appliance:
    - air_conditioner
    - washer
    - rice_cooker
  answer: 麻烦告诉我三件事：是什么电器、什么品牌、屏幕上几位字符（纯数字还是带字母，闪不闪）。详见 症状库 symptoms.yaml#code_display。
  steps:
  - 确认品类与品牌
  - 记录代码原文
  - 记录是否闪烁
  source: symptoms.yaml#code_display
  verified: true
