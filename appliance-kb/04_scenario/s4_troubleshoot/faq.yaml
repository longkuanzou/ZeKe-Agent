  question: 外机冒烟了
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 先确认是"白雾"还是"烟"。详见 症状库 symptoms.yaml#outdoor_steam。
  source: symptoms.yaml#outdoor_steam
  handoff:
    needed: true
