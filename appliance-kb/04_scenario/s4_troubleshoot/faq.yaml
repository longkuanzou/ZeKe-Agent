    - haier
  answer: 海尔这个型号的说明书里没有故障代码表，代码含义我不能凭经验跟您说，说错了会影响判断。详见 haier-kfr-35gw-e1-1 的 faults.yaml（codes）。
  source: 03_product/air_conditioner/haier/KFR-35GW-E1-1/faults.yaml#codes
  handoff:
    needed: true
