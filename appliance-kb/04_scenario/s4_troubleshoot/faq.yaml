- id: faq-s4.004
  question: 空调声音很大
  intent: troubleshoot.noise
  scope:
    appliance: air_conditioner
  answer: 先分清是哪种声音。详见 症状库 symptoms.yaml#noise_water_flow。
  source: symptoms.yaml#noise_water_flow / noise_crack / noise_outdoor_loud
  handoff:
    needed: true
    reason: abnormal_noise
  verified: true
  note: 先挡正常现象，再分诊
- id: faq-s4.005
  question: 室内机漏水
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 先别开机了，把电源断掉。详见 症状库 symptoms.yaml#water_leak_indoor。
  source: symptoms.yaml#water_leak_indoor
  handoff:
    needed: true
    reason: safety
  verified: true
  note: stop_and_call，第一句就是停机
- id: faq-s4.006
  question: 出风口滴水
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 如果只是出风口边缘滴水、而且是闷热潮湿天气长时间制冷，这是冷凝水，正常现象。详见 症状库 symptoms.yaml#outlet_drip。
  source: symptoms.yaml#outlet_drip
  verified: true
- id: faq-s4.007
  question: 吹出来有异味
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 多数是滤网和蒸发器积灰发霉。详见 症状库 symptoms.yaml#bad_smell。
  source: symptoms.yaml#bad_smell
  verified: true
- id: faq-s4.008
  question: 开机没反应
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 四步：① 换个插座试试有没有电；② 看家里空开跳没跳；③ 遥控器换新电池；④ 如果刚断过电，等 3 分钟再开（压缩机保护）。详见 症状库 symptoms.yaml#no_power。
  steps:
  - 换插座测试
  - 检查空开
  - 换遥控器电池
  - 等 3 分钟
  source: symptoms.yaml#no_power
  verified: true
- id: faq-s4.009
  question: 制热不热
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 刚开机制热会先预热几分钟不出热风，这是防冷风吹人的保护，等一下就好。详见 症状库 symptoms.yaml#not_heating。
  source: symptoms.yaml#not_heating
  verified: true
- id: faq-s4.010
  question: 效果不如以前了
  intent: troubleshoot.symptom
  scope:
    appliance: air_conditioner
  answer: 最常见是滤网和蒸发器积灰，先洗滤网。详见 症状库 symptoms.yaml#weak_effect。
  source: symptoms.yaml#weak_effect
  handoff:
    needed: true
    reason: suspect_refrigerant
  verified: true
