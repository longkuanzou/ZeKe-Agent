# 使用与保养：使用咨询（s3）的操作步骤来源
# 步骤必须与说明书顺序一致；用户问"怎么弄"时直接复用 steps，不要改写顺序
product_id: midea-kfr-35gw-q2
updated: 2026-10-21

first_use:
  source: p9
  steps:
    - 确认已由专业人员完成安装、检漏、试机
    - 插上电源（首次上电后显示屏可能自检，属正常）
    - 用遥控器开机，选择模式（制冷/制热/送风/抽湿/自动）
    - 设定温度；制冷建议 26℃，制热建议 20~22℃
    - 调整导风板方向（制冷向上、制热向下）

modes:
  cooling: {source: p9}
  heating: {source: p9}
  dry:     {source: p9}
  fan:     {source: p9, note: 送风模式不制冷不制热，无法设定温度}
  auto:    {source: p9}
  auxiliary_heat: {source: p20, note: 制热时可开启电辅热（850W），耗电会明显上升}

operations:
  timer:
    steps: [按定时键进入定时设置, 选择开机或关机, 设定时间, 确认]
    source: p16
  anti_direct_blow:
    steps: [按防直吹键进入防直吹模式, 导风板自动调整角度]
    source: p14
  wifi_bind:
    steps:
      - 手机安装「美的美居」App 并注册登录
      - App 首页点"+"→ 添加设备，扫描机身二维码或选择品类型号
      - 按向导为设备连接网络（仅支持 2.4GHz）
      - 联网失败按 App 提示处理
    source: p28
    notes:
      - 仅支持 2.4GHz 频段
      - 路由器 Wi-Fi 名称不建议含中文或特殊字符
      - 同一路由器建议不超过 10 台设备

maintenance:
  滤尘网清洁:
    steps:
      - 断电停机
      - 双手抓住面板两端下侧扣手位，按箭头方向打开面板约 75 度并卡住
      - 抬起滤尘网中间凸部，向下拉出
      - 用温水加中性洗涤剂清洗，阴凉处晾干（不可暴晒、不可用热水）
      - 装回滤尘网并关闭面板
    source: p20
    frequency: 说明书未规定周期；建议换季/使用旺季前清洁一次（行业建议，非说明书条款）
  机身表面清洁:
    steps: [断电, 湿布拧干后轻拭; 顽固污渍用中性清洁剂水溶液, 禁用强酸强碱/酒精类溶剂]
    source: p20
  导风板清洁:
    steps: [关机状态下同时长按遥控器组合键进入待机清洁状态, 待外导风板完全打开后断电, 湿布擦拭, 通电后导风板自动复位]
    source: p20
    注意: 该操作仅用于清洁导风板，不等于自清洁

long_absence:
  steps: [断电, 清洁滤尘网并晾干装回, 取出遥控器电池, 遥控器与机身分开存放]
  source: p21

limits:
  working_env: {cooling: "室外 18~43℃", heating: "室外 -7~24℃", source: p31}
  protection_ranges: {source: p31,
    cooling: "室外 >65℃ 或 <-18℃、室内 <21℃ 可能停机保护",
    heating: "室外 >24℃ 或 <-35℃、室内 >27℃ 可能停机保护",
    dry: "室内 <18℃ 可能停机保护"}
  note: 温度超出上述范围导致不制冷/不制热，属保护性停机，不是故障——这是 s4 里最高频的"假故障"
