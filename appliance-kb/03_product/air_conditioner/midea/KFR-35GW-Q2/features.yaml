  fresh_air:  {supported: false, source: null, note: 说明书无新风相关内容}
  humidity_sensor: {supported: null, source: null}

# 销售侧可讲的差异化点（需与实际参数一致，不得夸大）
selling_points:
  - key: efficiency_apf
    text: APF 5.32、1 级能效（GB 21455-2019）
    support: specs.efficiency_apf
  - key: low_temp_heating
    text: 低温制热量 4920W，低温制热功率 1835W，北方冬季可用
    support: specs.low_temp_heating_capacity_w
  - key: anti_direct_blow
    text: 支持防直吹
    support: features.anti_direct_blow

# 明确不能说的（防止幻觉，也防投诉）
cannot_claim:
  - 自清洁 / 自动清洗
  - 新风 / 换气
  - 具体适用面积（说明书仅给最小房间面积 4㎡）
  - 静音档以外的噪音承诺
