product_id: midea-kfr-35gw-q2
updated: 2026-10-21

features:
  cooling:    {supported: true,  source: p9,  phrase: 制冷}
  heating:    {supported: true,  source: p9,  phrase: 制热}
  dry:        {supported: true,  source: p9,  phrase: 抽湿}
  fan_only:   {supported: true,  source: p9,  phrase: 送风}
  auto_mode:  {supported: true,  source: p9,  phrase: 自动}
  auxiliary_heat: {supported: true, source: p20, phrase: 电辅热，850W}
  timer:      {supported: true,  source: p16, phrase: 定时开关机}
  sleep:      {supported: null,  source: null, note: 说明书未单列睡眠模式，按不确定处理}
  anti_direct_blow: {supported: true, source: p14, phrase: 防直吹}
  self_clean: {supported: false, source: p20,
