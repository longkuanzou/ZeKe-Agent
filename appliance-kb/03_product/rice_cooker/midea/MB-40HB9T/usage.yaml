# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: midea-mb-40hb9t
updated: 2026-10-23

first_use:
  items:
    - 取出内锅与所有包装填充件（含内锅与加热盘之间的纸卡）
    - 用清水洗净内锅，用软布擦干内外表面（外表面必须干燥，否则会污损加热盘）
    - 内锅放回煲体，轻轻转动使其完全落位，压下面盖至听到「咔嗒」声
  source: 'ocr#img:产品简介.png'

cook_steps:
  items:
    - 用随机量杯量米，淘洗后放入内锅
    - 按内锅刻度加水：先确认米种刻度（东北米 / 丝苗米 / 五常米 的刻度不同），水量不得超过最高水位线
    - 擦干内锅外表面后放入煲体，转动使落位，盖好面盖
    - 选择功能（必要时先选米种/口感），按「开始」
    - 烹饪结束自动进入保温；不需要保温时按「取消」断电
  source: 'ocr#img:快速入门.png'

water_ratio:
  rule: 以水位线与量杯为准，不用「几杯米配几杯水」的口诀代替
  cautions:
    - 任何情况下水量不能超过最高水位线
    - 蒸煮时水量不能超过蒸煮水位线（部分机型无此线，以实物为准）
    - 米量变化后按对应刻度重新对位，不要沿用上次的水量
  source: 'ocr#img:快速入门.png'

timer:
  note: 原文「预约时间建议不要超过 12 小时，否则米饭会出现异味」；短按「预约」+10 分钟、长按 +1 小时
  source: 'ocr#img:使用技巧-预约.png'
  cannot_timer: [热饭, 保温]
  cannot_timer_reason: 这些功能要么本身就是「热一下/保温」，要么需要收汁控时，预约会导致口感与安全问题，说明书明确禁止

maintenance:
  clean_inner_pot:
    steps:
      - 每次用完后待冷却再清洗，用软海绵 + 中性清洁剂
      - 用软布擦干内外表面后再放回煲体
      - 严禁钢丝球擦拭内锅，会刮伤涂层
    source: 'ocr#img:清洁保养.png'
  clean_heater:
    steps:
      - 先断电待冷却，用抹布清除加热盘/线圈盘上的水、米粒等杂物
      - 不要把水直接冲进煲体，严禁整机浸水
    source: 'ocr#img:清洁保养.png'
  clean_lid_and_valve:
    steps:
      - 按下/上推可拆盖按钮取下内盖，用清水冲洗后擦干，按卡槽装回听到卡合声
      - 蒸汽阀取下清洗后装回，必须卡到位，否则漏汽影响烹饪效果
    source: 'ocr#img:清洁保养.png'

model_notes:
  - IH 加热是推断值（线圈盘 + 1300W + 一级能效）：用户问「是不是 IH」时按 IH 回答，但遇到退货争议需以机身铭牌为准
  - '外形尺寸与净重已按品牌官方产品页补入（338×270×235mm / 5.9kg），标 confidence: web —— 说明书本身没印；用户要凭证时说明这是官网参数，并以包装标贴为准'
