# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: supor-sf50fc733
updated: 2026-10-23

first_use:
  items:
    - 取出内锅与所有包装填充件（含内锅与加热盘之间的纸卡）
    - 用清水洗净内锅，用软布擦干内外表面（外表面必须干燥，否则会污损加热盘）
    - 内锅放回煲体，轻轻转动使其完全落位，压下面盖至听到「咔嗒」声
  source: 'ocr#说明书:p11'

cook_steps:
  items:
    - 用随机量杯量米，淘洗后放入内锅
    - 按内锅刻度加水，水量不得超过最高水位线；内锅未印米种刻度时按通用刻度对位
    - 擦干内锅外表面后放入煲体，转动使落位，盖好面盖
    - 选择功能（必要时先选米种/口感），按「开始」
    - 烹饪结束自动进入保温；不需要保温时按「取消」断电
  source: 'ocr#说明书:p11'

water_ratio:
  rule: 以水位线与量杯为准，不用「几杯米配几杯水」的口诀代替
  cautions:
    - 任何情况下水量不能超过最高水位线
    - 蒸煮时水量不能超过蒸煮水位线（部分机型无此线，以实物为准）
    - 米量变化后按对应刻度重新对位，不要沿用上次的水量
  source: 'ocr#说明书:p11'

timer:
  note: 产品特点原文「24 小时预约定时」；这是预约上限，不是建议值
  source: 'ocr#说明书:p11'
  cannot_timer: []

maintenance:
  clean_inner_pot:
    steps:
      - 每次用完后待冷却再清洗，用软海绵 + 中性清洁剂
      - 用软布擦干内外表面后再放回煲体
      - 严禁钢丝球/清洁球擦拭内锅内外表面；严禁把内锅与可拆盖放进洗碗机
    source: 'ocr#说明书:p11'
  clean_heater:
    steps:
      - 先断电待冷却，用抹布清除加热盘/线圈盘上的水、米粒等杂物
      - 不要把水直接冲进煲体，严禁整机浸水
    source: 'ocr#说明书:p11'
  clean_lid_and_valve:
    steps:
      - 按下/上推可拆盖按钮取下内盖，用清水冲洗后擦干，按卡槽装回听到卡合声
      - 蒸汽阀取下清洗后装回，必须卡到位，否则漏汽影响烹饪效果
    source: 'ocr#说明书:p11'

model_notes:
  - 型号在说明书里以两个写法出现：SF50FC733 与 CFXB50FC9133Q-75，报价/建单时两种都要能对上
  - 说明书明确「器具正常工作的海拔高度范围为 0-2000 米」：高原地区用户报「煮不熟/溢锅」先问海拔，超过 2000 米属超范围使用
  - 明确禁止把内锅、可拆盖放进洗碗机（碱性清洗剂会破坏涂层），这是「洗坏内胆」纠纷的判定依据
  - 面板「稀饭」与「煮粥」是两个独立功能键，不要合并回答
