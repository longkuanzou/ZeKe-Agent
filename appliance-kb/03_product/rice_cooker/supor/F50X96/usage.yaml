# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: supor-f50x96
updated: 2026-10-23

first_use:
  items:
    - 取出内锅与所有包装填充件（含内锅与加热盘之间的纸卡）
    - 用清水洗净内锅，用软布擦干内外表面（外表面必须干燥，否则会污损加热盘）
    - 内锅放回煲体，轻轻转动使其完全落位，压下面盖至听到「咔嗒」声
  source: 'ocr#p4'

cook_steps:
  items:
    - 用随机量杯量米，淘洗后放入内锅
    - 按内锅刻度加水：先确认米种刻度（东北米 / 五常米 / 丝苗米 的刻度不同），水量不得超过最高水位线
    - 擦干内锅外表面后放入煲体，转动使落位，盖好面盖
    - 选择功能（必要时先选米种/口感），按「开始」
    - 烹饪结束自动进入保温；不需要保温时按「取消」断电
  source: 'ocr#p4'

water_ratio:
  rule: 以水位线与量杯为准，不用「几杯米配几杯水」的口诀代替
  cautions:
    - 任何情况下水量不能超过最高水位线
    - 蒸煮时水量不能超过蒸煮水位线（部分机型无此线，以实物为准）
    - 米量变化后按对应刻度重新对位，不要沿用上次的水量
  source: 'ocr#p4'

timer:
  note: 说明书未给预约时长上限
  source: 'ocr#p4'
  cannot_timer: []

maintenance:
  clean_inner_pot:
    steps:
      - 每次用完后待冷却再清洗，用软海绵 + 中性清洁剂
      - 用软布擦干内外表面后再放回煲体
      - 严禁钢丝球/清洁球擦拭内锅内外表面；严禁把内锅与可拆盖放进洗碗机
    source: 'ocr#p4'
  clean_heater:
    steps:
      - 先断电待冷却，用软布清除加热盘上的水与米粒
      - 结焦严重时按说明书用 320# 砂纸轻磨加热盘（只限加热盘，内锅绝不可磨）
    source: 'ocr#p4'
  clean_lid_and_valve:
    steps:
      - 按下/上推可拆盖按钮取下内盖，用清水冲洗后擦干，按卡槽装回听到卡合声
      - 微压阀逆时针旋到开锁位取下清洗，装回必须顺时针旋到闭合位，凸点对位、不得浮起或倾斜
    source: 'ocr#p4'

model_notes:
  - 这份资料是 3 本装（安全须知 / 技术参数与使用 / 操作指南），覆盖 20 多个型号，很多段落是「部分型号适用」，回答时必须限定到 F50X96 本身
  - 故障代码在「说明书3」第 8 页：E0/E1/E5/E6/E7；其中 E6 是「无蒸汽水杯」，只有这台高配机型有，别和其它型号混用
  - 带蒸汽水杯：E6 报警先让用户把水杯放进去重新通电，属于放置问题不是硬件坏
  - 食品接触材料表列了多种内锅材质，本型号未指定，禁止回答具体内胆材质
  - 含「无水焗」「煲仔饭」「蛋糕」「清洁」程序，是 5L 系列里的高配面板
