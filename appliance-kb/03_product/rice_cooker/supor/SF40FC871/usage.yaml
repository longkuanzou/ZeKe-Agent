# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: supor-sf40fc871
updated: 2026-10-23

first_use:
  items:
    - 取出内锅与所有包装填充件（含内锅与加热盘之间的纸卡）
    - 用清水洗净内锅，用软布擦干内外表面（外表面必须干燥，否则会污损加热盘）
    - 内锅放回煲体，轻轻转动使其完全落位，压下面盖至听到「咔嗒」声
  source: p8

cook_steps:
  items:
    - 用随机量杯量米，淘洗后放入内锅
    - 按内锅刻度加水，水量不得超过最高水位线；内锅未印米种刻度时按通用刻度对位
    - 擦干内锅外表面后放入煲体，转动使落位，盖好面盖
    - 选择功能（必要时先选米种/口感），按「开始」
    - 烹饪结束自动进入保温；不需要保温时按「取消」断电
  source: p8

water_ratio:
  rule: 以水位线与量杯为准，不用「几杯米配几杯水」的口诀代替
  cautions:
    - 任何情况下水量不能超过最高水位线
    - 蒸煮时水量不能超过蒸煮水位线（部分机型无此线，以实物为准）
    - 米量变化后按对应刻度重新对位，不要沿用上次的水量
  source: p8

timer:
  note: 说明书第 6 页「预约」键说明只讲操作，未给时长上限
  source: p8
  cannot_timer: []

maintenance:
  clean_inner_pot:
    steps:
      - 每次用完后待冷却再清洗，用软海绵 + 中性清洁剂
      - 用软布擦干内外表面后再放回煲体
      - 严禁钢丝球/清洁球擦拭内锅内外表面；严禁把内锅与可拆盖放进洗碗机
    source: p8
  clean_heater:
    steps:
      - 先断电待冷却，用软布清除加热盘上的水与米粒
      - 结焦严重时按说明书用 320# 砂纸轻磨加热盘（只限加热盘，内锅绝不可磨）
    source: p8
  clean_lid_and_valve:
    steps:
      - 按下/上推可拆盖按钮取下内盖，用清水冲洗后擦干，按卡槽装回听到卡合声
      - 蒸汽阀取下清洗后装回，必须卡到位，否则漏汽影响烹饪效果
    source: p8

model_notes:
  - 面板是顶置触控设计（产品特点原话「操作不弯腰」），用户说「找不到按键」多半是在正面找，要引导看锅盖顶部
  - 内盖一键可拆，清洗口径是「海绵冲洗 + 干软布擦干」，明确禁止钢丝球与清洁球
  - 随机附件含保修卡，一年包修，包修期自实际收到产品之日起算（网购凭证/电子保修卡/发票为凭）
