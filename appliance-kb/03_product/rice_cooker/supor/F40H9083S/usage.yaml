# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: supor-f40h9083s
updated: 2026-10-23

first_use:
  items:
    - 取出内锅与所有包装填充件（含内锅与加热盘之间的纸卡）
    - 用清水洗净内锅，用软布擦干内外表面（外表面必须干燥，否则会污损加热盘）
    - 内锅放回煲体，轻轻转动使其完全落位，压下面盖至听到「咔嗒」声
  source: p2

cook_steps:
  items:
    - 用随机量杯量米，淘洗后放入内锅
    - 按内锅刻度加水：先确认米种刻度（东北米 / 丝苗米 的刻度不同），水量不得超过最高水位线
    - 擦干内锅外表面后放入煲体，转动使落位，盖好面盖
    - 选择功能（必要时先选米种/口感），按「开始」
    - 烹饪结束自动进入保温；不需要保温时按「取消」断电
  source: p2

water_ratio:
  rule: 以水位线与量杯为准，不用「几杯米配几杯水」的口诀代替
  cautions:
    - 任何情况下水量不能超过最高水位线
    - 蒸煮时水量不能超过蒸煮水位线（部分机型无此线，以实物为准）
    - 米量变化后按对应刻度重新对位，不要沿用上次的水量
  source: p2

timer:
  note: 说明书只说明「预约时间需大于烹饪时间」，未给时长上限
  source: p2
  cannot_timer: []

maintenance:
  clean_inner_pot:
    steps:
      - 每次用完后待冷却再清洗，用软海绵 + 中性清洁剂
      - 用软布擦干内外表面后再放回煲体
      - 严禁钢丝球/清洁球擦拭内锅内外表面；严禁把内锅与可拆盖放进洗碗机
    source: p2
  clean_heater:
    steps:
      - 先断电待冷却，用软布清除加热盘上的水与米粒
      - 结焦严重时按说明书用 320# 砂纸轻磨加热盘（只限加热盘，内锅绝不可磨）
    source: p2
  clean_lid_and_valve:
    steps:
      - 按下/上推可拆盖按钮取下内盖，用清水冲洗后擦干，按卡槽装回听到卡合声
      - 微压阀逆时针旋到开锁位取下清洗，装回必须顺时针旋到闭合位，凸点对位、不得浮起或倾斜
    source: p2

model_notes:
  - 低糖饭是本品与 F40H8093S 的关键差异：必须用配套「低糖甑」，不放甑就是普通煮饭，不能宣称降糖率
  - 说明书未给任何降糖比例/检测报告，禁止回答具体降糖百分比
  - 说明书 6 页无技术参数页：功率、电压、尺寸、净重、能效全部缺失
