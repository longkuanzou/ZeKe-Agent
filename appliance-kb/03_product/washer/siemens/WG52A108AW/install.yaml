transport:
  net_weight_kg: {value: 70.1, source: p17}
  transport_bolts: {value: 4, source: 'p7',
    text: 背面 4 颗运输固定螺栓，用 13 号扳手松开拆下，再装入孔塞；不拆就脱水会剧烈震动}

pre_visit_checklist:
  - 放置位置有水龙头吗，接口是不是 G3/4 外螺纹
  - 水压是否稳定（低于 0.1MPa 会报进水故障）
  - 水龙头打开时流量是否达到 8 升/分钟
  - 插座位置与是否带地线，会不会被机身挡住
  - 是否需要嵌入柜体（决定预留间隙与散热）
  - 从楼下到房间最窄门口宽度、楼梯转角
  - 楼层与是否有电梯（影响上楼费）

chargeable_items: [上楼费, 远程上门, 加长进水管, 拆门/扩门洞, 加装水龙头]
not_applicable: [高空作业费, 加长冷媒管, 支架费]

missing:
  - door_width_min_mm（说明书未给搬运最小门宽）
  - 是否可叠放叠放支架型号（说明书未给通用结论）
