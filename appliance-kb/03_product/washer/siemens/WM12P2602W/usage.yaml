# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: siemens-wm12p2602w
updated: 2026-10-23

first_use:
  items:
    - 拆掉背面 4 颗运输固定螺栓（13 号扳手），装入孔塞（不拆就脱水会剧烈震动）
    - 调平：17 号扳手松开防松螺母，转动支脚，用水平仪确认后锁紧
    - 打开水龙头，检查进水管接口是否渗漏（只用手拧紧）
  source: "p7"

wash_steps:
  items:
    - 打开机门，抖散衣物放入，注意不要夹在门口
    - 按衣物护理标签分类，检查口袋内异物
    - 选定程序与温度、脱水转速
    - 按启动/暂停键
  source: "p19"

maintenance:
  clean_pump_filter:
    steps:
      - 先让机器排水，等筒内水冷却（避免烫伤）
      - 打开排水泵维护盖，拉出排水软管放水
      - 旋开泵盖清理异物，装回并拧紧
    source: "p28"
  clean_detergent_drawer:
    steps:
      - 拉出洗涤剂盒，取出投放盒清洗
      - 清洁盒内腔与下方前封门处的水渍残留
    source: "p28"

model_notes:
  - key: unbalanced_spin
    text: 机器检测到衣物不平衡会自动降低脱水转速，属保护行为，不是故障
  - key: door_delay
    text: 程序结束后机门需约 2 分钟才解锁，属门锁保护
