# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: siemens-wq53e2d01w-wq53e2d11w
updated: 2026-10-23

first_use:
  items:
    - 拆掉运输固定件（干衣机同样有运输螺栓）
    - 调平：用水平仪确认，四个支脚都牢靠落地后锁紧防松螺母
    - 确认冷凝水箱已装到位，或已正确连接直排软管
  source: "p7"

wash_steps:
  items:
    - 打开机门，抖散衣物后放入，不要塞紧
    - 检查衣物护理标签，确认可滚筒烘干
    - 关好机门，选择程序后启动
    - 程序结束后及时取出衣物，避免回潮起皱
  source: "p19"

maintenance:
  empty_water_tank:
    steps:
      - 每次烘干后倒空冷凝水箱
      - 水箱没装到位时机器不会启动，属保护设计
    source: "p8"
  clean_filter:
    steps:
      - 每次烘干后清理门内绒毛滤网（热泵机尤其重要，堵了烘干时间变长）
      - 清理机身下部换热器区域的绒毛
    source: "p28"

model_notes:
  - key: heat_pump
    text: 热泵干衣机靠低温循环除湿，烘干时间比冷凝式长但更省电、对衣物更温和
  - key: no_water
    text: 不需要接水管；用户问「要不要装水龙头」答「不用」
