# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: littleswan-tg10ve40
updated: 2026-10-22

first_use:
  items:
    - 拆掉机身背面 4 颗运输螺栓（不拆会剧烈震动，是「新机就抖」的头号原因）
    - 调平：对角线按压顶盖，调整底脚使机器平稳
    - 先跑一次「筒自洁」程序清洁内筒，不加衣物、不加洗涤剂
    - 打开进水龙头，检查进水管接口是否渗漏
  source: "ocr#温馨提示.jpg"

wash_steps:
  items:
    - 开门：按压机门右侧打开
    - 投放衣物：不要把衣物夹在机门处，否则会损坏衣物甚至漏水
    - 关门：听到「咔哒」声表示已关好
    - 投放洗涤剂后按启动
  source: "ocr#快速入门-图文.jpg"

detergent:
  items:
    - 洗涤剂盒为自动投放盒，可存储一定量洗衣液和柔顺剂，不必每次都加
    - 洗衣凝珠直接放进洗涤筒，不要放洗涤剂盒；用凝珠时要关闭自动投放
    - 结块或粘稠的洗涤剂，倒入前先用少量水稀释
    - 不要用高泡洗衣液：泡沫多会导致漂洗不净或泡沫溢出漏水
    - 机器运行时不要打开洗涤剂盒；料盒没装到位时屏幕图标闪烁，装好即熄灭
  source: "ocr#快速入门-图文.jpg"

maintenance:
  filter_clean:
    steps:
      - 拔掉电源插头，打开过滤器门／排污口
      - 先确认筒内水已冷却，再拔管堵头放水（避免烫伤）
      - 取出过滤网清理杂物，装回并确认到位
    source: "ocr#清洁保养.jpg"
  detergent_box_clean:
    steps:
      - 拉出洗涤剂盒并向上轻抬取出
      - 分别取出洗衣液、柔顺剂自动投放盒，打开盒盖用软毛刷清洁后冲净
      - 装回后清洁洗涤盒下方前封门处的水渍与残留
    source: "ocr#清洁保养.jpg"
  inlet_valve_filter:
    steps:
      - 先关闭进水龙头
      - 拧下进水管，用毛刷清洗进水阀处过滤网
      - 重新接好后打开水龙头，检查是否漏水
    source: "ocr#清洁保养.jpg"
  emergency_door_open:
    steps:
      - 关闭电源并拔掉插头
      - 打开过滤器门，先排掉筒内已冷却的水
      - 用工具插入橙色紧急拉绳向下拉，打开门锁
    warning: 正常洗涤过程中禁止使用紧急拉绳；必须使用时须等水冷却，避免高温水流出烫伤
    source: "ocr#清洁保养.jpg"

missing:
  - 过滤器清理的官方建议周期（说明书只写「定期」）
  - 内筒深度清洁（除筒自洁外）的官方方法
