product_id: littleswan-tb100v26dt
updated: 2026-10-22

codes:
  has_code_display: true
  display: 数码管（程序显示 01~07，报警显示 E 类代码）
  rule: [关机后重新开机启动, 同一代码再次出现则报修]
  known: []      # 代码表 OCR 不可靠，未采信任何数字
  note: 说明书有 E1~E4 报警，明确「E1-E4 报警解除需关闭门盖，按启动键」；逐条含义未列

# 说明书明确写出的「现象 → 原因 → 解决」，可作为自助排查第一步
self_check:
  - symptom: 洗衣机无法启动
    cause: 机门没关紧 / 水龙头没开 / 没按启动键
    action: 重新关门；确认打开水龙头；按启动/暂停键
    source: "ocr#常见问题.jpg"
  - symptom: 机门打不开
    cause: 机器安全保护设计，正在工作
    action: 关闭电源重新开机，等待机器安全后开门
    source: "ocr#常见问题.jpg"
  - symptom: 漏水
    cause: 进水管或排水管连接不牢
    action: 检查并紧固水管，清理排水管
    source: "ocr#常见问题.jpg"
  - symptom: 料盒中有残留洗衣粉
    cause: 洗衣粉受潮、结块
    action: 清洁并擦干料盒
    source: "ocr#常见问题.jpg"
  - symptom: 洗涤效果不佳
    cause: 衣物太脏 / 洗涤剂剂量不足
    action: 选择合适的洗衣程序；选用专用机洗低泡洗衣粉
    source: "ocr#常见问题.jpg"
  - symptom: 指示灯或显示屏不亮
    cause: 断电 / 电脑板、线束故障
    action: 确认未停电，以及电源插头正确插接；仍不亮则报修
    source: "ocr#常见问题.jpg"
  - symptom: 震动过大、噪音较大
    cause: 运输螺栓未拆除 / 未装在坚固水平地面
    action: 拆除背面 4 颗运输螺栓；调整底脚使机器平稳
    source: "ocr#常见问题.jpg"
  - symptom: 脱水延时或不脱水
    cause: 衣物过少或过多触发偏心保护 / 泡沫过多等待消泡
    action: 调整衣物数量并均匀分布后重新运行；泡沫情况等待程序自行完成
    source: "ocr#常见问题.jpg"

# 说明书明确「属正常」的现象，用于拦截假故障工单
normal_phenomena:
  - id: spin_delay_low_load
    symptom: 衣物较少时脱水延时或不脱水
    explain: 偏心保护会先低速检测并重新分布衣物；增加部分衣物均匀分布后按启动键继续
    source: "ocr#常见问题.jpg"
  - id: foam_extra_time
    symptom: 洗涤中程序时间变长、迟迟不脱水
    explain: 检测到泡沫过多会进入静置或缓慢转动、进水除泡，属正常
    source: "ocr#常见问题.jpg"
  - id: power_off_resume
    symptom: 停电后机器停了，来电后没有继续
    explain: 断电记忆在来电后继续运行；若断电期间按了电源键关机，则需重新开始
    source: "ocr#常见问题.jpg"
  - id: ub_prompt
    symptom: 面板显示 Ub
    explain: 衣物不平衡保护提示，不是硬件故障；取出抖散或拧掉部分水分后重新放入即可
    source: "ocr#常见问题.jpg"
  - id: door_locked_running
    symptom: 运行中机门打不开
    explain: 安全保护设计，运行中门锁不放行；需关机后等待安全时间再开
    source: "ocr#常见问题.jpg"

protection:
  drain_hose_max_height_mm: {value: null, source: null,
    note: 波轮说明书未给排水管高度限值，但排水管必须低于机器排水口才能自流排出}

model_specific_notes:
  - 本机排水方式说明书未标注：用户说「排不出去」时，先确认排水管是否已放下、是否高于机器排污口
  - 本机无烘干：用户说「不干」时先确认是不是单洗机型，不存在「烘干坏了」

