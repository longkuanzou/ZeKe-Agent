updated: 2026-10-22

features:
  dry: {supported: false, note: 波轮机，说明书无烘干相关内容}
  steam: {supported: null, note: 说明书未提蒸汽/除菌程序；程序表有「除螨」但未说明是否高温}
  self_clean: {supported: null, note: 波轮说明书无筒自洁程序，仅有内桶清洁保养指引}
  wifi: {supported: null, note: 说明书未见联网指引}
  child_lock: {supported: null, note: 说明书未提童锁}
  auto_dosing: {supported: false, note: 波轮机型为手动投放洗涤剂}
  auto_weight: {supported: null}
  water_level_manual: {supported: true, source: "ocr#使用技巧.jpg", note: 水位键可手动设定水位}
  wash_strength: {supported: true, source: "ocr#使用技巧.jpg", note: 长按强度键调 P1/P2/P3，洗涤强度逐步提高，标准/快洗/速洗可用}
