# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序
product_id: littleswan-tb100v26dt
updated: 2026-10-22

first_use:
  items:
    - 首次使用前，用柔软干净的布条清洁内桶
    - 接通电源，放下排水管，放入衣物，打开水龙头，添加洗涤剂
    - 因串色与染料有关，建议衣物分开洗涤
  source: "ocr#快速入门.jpg"

wash_steps:
  items:
    - 轻触电源键开机，等待功能键全亮进入待机状态
    - 连续按「程序」键选择程序（数码管显示 01~07）
    - 按「水位」键设定水量；需要更高洗净度可长按强度键调 P1/P2/P3
    - 需要预约时，长按预约键 3 秒设定预约时间
    - 按「启动/暂停」键开始洗涤
  source: "ocr#快速入门.jpg"

detergent:
  items:
    - 波轮为手动投放，按水位与衣物量自行添加，不要用高泡洗衣液
    - 洗衣结束后请关闭水龙头、切断电源
  source: "ocr#快速入门.jpg"

maintenance:
  filter_clean:
    steps:
      - 拔掉电源插头，打开过滤器门／排污口
      - 先确认筒内水已冷却，再拔管堵头放水（避免烫伤）
      - 取出过滤网清理杂物，装回并确认到位
    source: "ocr#清洁保养.jpg"

missing:
  - 过滤器清理的官方建议周期（说明书只写「定期」）
