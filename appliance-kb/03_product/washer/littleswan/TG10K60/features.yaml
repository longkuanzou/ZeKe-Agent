# 销售侧可讲的差异化点（需与实际参数一致，不得夸大）
selling_points:
  - key: capacity
    text: 10kg 大容量滚筒，被套四件套一次洗完
    support: specs.capacity_kg
  - key: energy
    text: 1 级能效，额定功率 1800W
    support: [specs.energy_grade, specs.power_w]
  - key: auto_dosing
    text: 洗衣液、柔顺剂都能自动投放，不用每次倒
    support: features.auto_dosing
  - key: quiet
    text: 洗涤 46dB(A)、脱水 68dB(A)（声功率级）
    support: [specs.noise_wash_db, specs.noise_spin_db]

# 明确不能说的（防止幻觉，也防投诉）
cannot_claim:
  - 烘干 / 洗烘一体（本机无烘干）
  - 蒸汽洗 / 蒸汽除菌（本机是高温净洗，不是蒸汽）
  - 空气洗
  - 除菌率 / 除螨率的具体百分比（说明书未给检测数据）
  - 具体耗水量（说明书未给）
  - 排水可接水槽（本机为上排水，需按排水管最高点限值安装，不能随意改）
