# 操作与保养：使用咨询（s3）的唯一依据
# 原则：一次只给一个动作，步骤照抄说明书不改序；说明书是图示的地方如实标"见图"
product_id: littleswan-tg10k60
updated: 2026-10-22

# ── 首次使用 ──
first_use:
  items:
    - 拆掉机身背面 4 颗运输螺栓（不拆会剧烈震动，是"新机就抖"的头号原因）
    - 调平：对角线按压顶盖，调整底脚使机器平稳
    - 先跑一次「筒自洁」程序清洁内筒，不加衣物、不加洗涤剂
    - 打开进水龙头，检查进水管接口是否渗漏
  source: "ocr#温馨提示.jpg"

# ── 日常洗涤四步 ──
wash_steps:
  items:
    - 开门：按压机门右侧打开
    - 投放衣物：不要把衣物夹在机门处，否则会损坏衣物甚至漏水
    - 关门：听到「咔哒」声表示已关好
    - 投放洗涤剂后按启动
  source: "ocr#快速入门-图文.jpg"

# ── 洗涤剂投放（本机是自动投放，最容易出错）──
detergent:
  items:
    - 洗涤剂盒为自动投放盒，可存储一定量洗衣液和柔顺剂，不必每次都加
    - 洗衣凝珠直接放进洗涤筒，不要放洗涤剂盒，否则会堵塞投放口；用凝珠时要关闭自动投放
    - 结块或粘稠的洗涤剂，倒入前先用少量水稀释
    - 不要用高泡洗衣液：泡沫多会导致漂洗不净或泡沫溢出漏水
    - 机器运行时不要打开洗涤剂盒；料盒没装到位时屏幕图标闪烁，装好即熄灭
  source: "ocr#快速入门-图文.jpg"

# ── 日常保养 ──
maintenance:
  filter_clean:
    frequency: 建议定期（说明书未给固定周期，按"排水变慢/有异味时清理"回答）
    steps:
      - 拔掉电源插头，轻按过滤器门使其自动弹出
      - 拉出紧急排水管，先确认筒内水已冷却，再拔堵头放水（避免烫伤）
      - 用钳子夹住过滤阀向左旋转取下，取出杂物
      - 装回过滤阀拧至限位筋，装回排水管，确认堵头已复位
    source: "ocr#清洁保养.jpg"
  detergent_box_clean:
    steps:
      - 拉出洗涤剂盒并向上轻抬取出
      - 从凸点处捏住，分别取出洗衣液、柔顺剂自动投放盒
      - 打开顶部取下盒盖，用软毛刷或软布清洁后用水冲洗
      - 盖好软盖装回，清洁洗涤盒下方前封门处的水渍与残留
    source: "ocr#清洁保养.jpg"
  inlet_valve_filter:
    steps:
      - 先关闭进水龙头
      - 拧下进水管，用毛刷清洗进水阀处过滤网（刷不干净可拔出过滤网单独洗）
      - 重新接好后打开水龙头，检查是否漏水
    source: "ocr#清洁保养.jpg"

# ── 应急操作 ──
emergency:
  emergency_door_open:
    steps:
      - 关闭电源并拔掉插头
      - 打开过滤器门，先排掉筒内已冷却的水
      - 用工具插入橙色紧急拉绳向下拉，打开门锁
    warning: 正常洗涤过程中禁止使用紧急拉绳；必须使用时须等水冷却，避免高温水流出烫伤
    source: "ocr#清洁保养.jpg"

# ── 本型号特有的行为（用户容易当成故障）──
model_notes:
  - key: ub_unbalance
    text: 高速脱水前会以约 100rpm 做偏心检测；不平衡时低速往复重新分布，多次仍不行会显示 Ub，需取出衣物抖散或拧掉部分水分后重按启动
    source: "ocr#使用说明-特色功能介绍.jpg"
  - key: foam_detection
    text: 检测到泡沫过多会进入静置或缓慢转动、进水除泡，表现为程序时间变长，属正常
    source: "ocr#使用说明-特色功能介绍.jpg"
  - key: forget_take
    text: 忘取无忧开启时，洗完后最长 8 小时内周期性抖散（2/4/6/8h 可选），直到取出衣物
    source: "ocr#使用说明-特色功能介绍.jpg"
  - key: program_memory
    text: 程序记忆默认开启，会记住上次程序与参数；需关闭可联网后在美的美居 App 关，或关机状态下长按面板对应键 3 秒
    source: "ocr#使用说明-特色功能介绍.jpg"
  - key: power_off_memory
    text: 洗涤中停电，来电后继续运行至结束；断电期间不要强行开门
    source: "ocr#使用说明-特色功能介绍.jpg"

