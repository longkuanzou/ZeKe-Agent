    query: 报修要准备哪些信息
    gold:
      - {doc_id: repair_request/intake.md, rel: 2}
      - {doc_id: repair_request/repair.md, rel: 1, note: 报修方式章节列了同样的必填项}

  - id: repair_parts_wait
    journey: repair_request
    query: 维修备件一般要等多久
    gold:
      - {doc_id: repair_request/progress_and_parts.md, rel: 2}
      - {doc_id: repair_request/repair.md, rel: 1, note: 维修周期章节给出备件等待区间}

  - id: after_sales_invoice_title
