  - id: after_sales_complaint_sla
    journey: after_sales
    query: 投诉后多久会回复
    gold:
      - {doc_id: after_sales/complaints/escalation.md, rel: 2}
      - {doc_id: troubleshoot/handoff_boundary.md, rel: 1, note: 升级到人工后的时限在两处一致}
